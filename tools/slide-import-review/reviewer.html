async function replaceImage(assetId, file) { clearErrors(); try { if (!file) return; if (!['image/jpeg', 'image/png'].includes(file.type)) throw new ReviewBundleError('Replacement must be JPEG or PNG.'); if (file.size <= 0 || file.size > PRODUCTION_LIMITS.maxImageBytes) throw new ReviewBundleError(`Replacement image must be 1-${PRODUCTION_LIMITS.maxImageBytes} bytes.`); const bytes = new Uint8Array(await file.arrayBuffer()), detected = detectImageType(bytes); if (detected !== file.type) throw new ReviewBundleError('Replacement image bytes do not match the selected MIME type.'); const item = asset(assetId), meta = [...indexes.reviewAssets.values()].map(values => values.get(assetId)).find(Boolean); fileStore().set(item.path, bytes); releaseUrl(item.path); item.mimeType = file.type; item.originalFilename = file.name; meta.sha256 = await sha256Hex(bytes); meta.extractionMethod = 'human_replacement'; meta.reviewStatus = 'needs_review'; refreshQueue(); await persist(); await renderCurrent(); } catch (error) { showErrors('Image replacement failed', [errorText(error)]); } }

async function approveCurrent() { clearErrors(); const meta = visibleCases[index]; if (!meta) return; const item = manifestCase(meta.caseId), issues = []; if (blocking(meta.warnings).length) issues.push(...blocking(meta.warnings).map(value => value.message)); if (!String(item?.title || '').trim()) issues.push('Case title is blank.'); if (!item?.primaryTopicId || !bundle.manifest.topics.some(value => value.id === item.primaryTopicId)) issues.push('Primary Topic is missing or invalid.'); for (const rel of caseAssets(meta.caseId)) { const review = indexes.reviewAssets.get(meta.caseId)?.get(rel.assetId), problems = []; if (!review) { issues.push(`Image ${rel.assetId} has no review metadata.`); continue; } if(review.reviewStatus==='rejected')continue; const image = asset(rel.assetId), bytes = image?.path ? await fileStore().getFile(image.path) : null; if (blocking(review.warnings).length) problems.push(...blocking(review.warnings).map(value => `Image ${rel.assetId}: ${value.message}`)); if (!image) problems.push(`Image ${rel.assetId} is missing from the manifest.`); if (!bytes) problems.push(`Image ${rel.assetId} media is missing.`); if (bytes && bytes.byteLength > PRODUCTION_LIMITS.maxImageBytes) problems.push(`Image ${rel.assetId} exceeds the current size limit.`); const detected = bytes ? detectImageType(bytes) : null; if (bytes && !detected) problems.push(`Image ${rel.assetId} is not a valid JPEG/PNG.`); if (detected && image?.mimeType !== detected) problems.push(`Image ${rel.assetId} MIME does not match its bytes.`); if (image && !String(image.altText || '').trim()) problems.push(`Image ${rel.assetId} has blank alt text.`); if (bytes && (!review.sha256 || (await sha256Hex(bytes)).toLowerCase() !== review.sha256.toLowerCase())) problems.push(`Image ${rel.assetId} SHA-256 does not match its reviewed bytes.`); if (!problems.length) review.reviewStatus = 'approved'; else { review.reviewStatus = 'needs_review'; issues.push(...problems); } } for (const relation of caseQuestions(meta.caseId)) { const review = indexes.reviewQuestions.get(meta.caseId)?.get(relation.id), problems = []; if (!review) { issues.push(`Question ${relation.id} has no review metadata.`); continue; } if(review.reviewStatus==='rejected')continue; const questionPrompt = prompt(relation.questionPromptId); if (blocking(review.warnings).length) problems.push(...blocking(review.warnings).map(value => `Question ${relation.id}: ${value.message}`)); if (!questionPrompt) problems.push(`Question ${relation.id} references a missing Prompt.`); else if (!String(questionPrompt.promptMd || '').trim()) problems.push(`Question ${relation.id} has a blank Prompt.`); if (!String(relation.answerMd || '').trim()) problems.push(`Question ${relation.id} has a blank answer.`); if (!problems.length) review.reviewStatus = 'approved'; else { review.reviewStatus = 'needs_review'; issues.push(...problems); } } for (const candidate of (indexes.unresolved.get(meta.caseId) ?? []).filter(value => !value.resolvedCaseQuestionId && value.reviewStatus !== 'rejected')) issues.push(`Unresolved question ${candidate.candidateId} is not resolved/rejected.`); if (issues.length) { meta.reviewStatus = 'needs_review'; refreshQueue(meta.caseId); await persist(); showErrors('Cannot approve Case', issues); await renderCurrent(); return; } meta.reviewStatus = 'approved'; refreshQueue(meta.caseId); await persist(); await renderCurrent(); }
async function setCaseStatus(status) { const meta = visibleCases[index]; if (!meta) return; const caseId = meta.caseId; meta.reviewStatus = status; refreshQueue(caseId); await persist(); await renderCurrent(); }

function renderCoverage() { updateCounts(); const rows = bundle.reviewMap.sourceCoverage.map(item => { const source = indexes.sources.get(item.sourceId); const broken = item.caseIds.some(id => !manifestCase(id)); const issue = item.classification === 'uncertain' || !item.classification || (item.previewPath && !fileStore().has(item.previewPath)) || broken; return `<tr class="${issue ? 'issue' : ''}"><td>${esc(source?.filename || item.sourceId)}</td><td>${item.page}</td><td>${esc(item.classification || 'missing')}</td><td>${esc(item.caseIds.join(', ') || '—')}</td><td>${esc(item.notes || '')}</td><td>${item.previewPath ? (fileStore().has(item.previewPath) ? 'available on demand' : 'missing') : 'none'}</td></tr>`; }).join(''); $('workspace').innerHTML = `<section class="coverage"><div class="row between"><h2>Source coverage</h2><button id="back-cases">Back to Case review</button></div><p class="small">Coverage is indexed without loading preview bytes.</p><table><thead><tr><th>Source</th><th>Page</th><th>Classification</th><th>Cases</th><th>Notes</th><th>Preview</th></tr></thead><tbody>${rows}</tbody></table></section>`; $('back-cases').onclick = () => { coverageMode = false; renderCurrent(); }; }

async function loadFile(input) { clearErrors(); if (!input) return; if (bundle && dirtyBeforeFingerprint) { showErrors('Finish checking saved review before switching bundles', ['Your edits are still waiting for exact source fingerprint verification.']); return; } if (bundle && dirty) { try { statusText('Saving before opening next bundle…'); if (!await flushPendingSave()) { showErrors('Cannot switch bundles', ['The latest review edits are not saved.']); return; } } catch (error) { showErrors('Cannot switch bundles', [errorText(error)]); return; } } const generation = ++loadGeneration; releaseResources(); bundle = null; indexes = null; bundleFingerprint = null; dirty = false; dirtyBeforeFingerprint = false; editRevision = 0; lastSavedRevision = 0; statusText('Opening bundle…'); try { const loaded = await loadReviewBundle(input); if (generation !== loadGeneration) return; bundle = loaded; rebuildIndexes(); filter = $('filter').value; refreshQueue(); coverageMode = false; $('empty-start').hidden = true; $('review-shell').hidden = false; $('batch').textContent = loaded.reviewMap.batchName; $('batch-warning').innerHTML = loaded.reviewMap.batchWarnings?.length ? `<div class="error-card"><strong>Batch warnings</strong>${warningHtml(loaded.reviewMap.batchWarnings)}</div>` : ''; const saved = await getSaved(loaded.reviewMap.bundleId); if (generation !== loadGeneration) return; if (saved) statusText('Checking saved review…'); else { await renderCurrent(); statusText('Checking saved review…'); } const fingerprint = await fingerprintFile(input); if (generation !== loadGeneration) return; bundleFingerprint = fingerprint; const matchingSaved = saved && persistedStateMatches(saved, bundle.reviewMap.bundleId, fingerprint); if (matchingSaved) { statusText('Restoring review…'); await restoreSaved(saved); refreshQueue(); } const hadDirty = dirtyBeforeFingerprint; dirtyBeforeFingerprint = false; await renderCurrent(); if (hadDirty && !matchingSaved) await persist(); else if (!matchingSaved) statusText(saved ? 'Ready · saved review belongs to a different ZIP' : 'Ready · local save starts after your first edit'); else statusText(`Restored locally · ${new Date(saved.updatedAt).toLocaleTimeString()}`); } catch (error) { if (generation === loadGeneration) showErrors('Could not open review bundle', errorText(error).split('\n')); } }

$('zip-input').onchange = event => loadFile(event.target.files?.[0]); const drop = $('drop'); drop.ondragover = event => { event.preventDefault(); drop.classList.add('drag'); }; drop.ondragleave = () => drop.classList.remove('drag'); drop.ondrop = event => { event.preventDefault(); drop.classList.remove('drag'); loadFile(event.dataTransfer.files?.[0]); };
$('prev').onclick = () => { if (index > 0) { index -= 1; selectedSourcePath = null; renderCurrent(); } }; $('next').onclick = () => { if (index < visibleCases.length - 1) { index += 1; selectedSourcePath = null; renderCurrent(); } }; $('approve').onclick = approveCurrent; $('needs').onclick = () => setCaseStatus('needs_review'); $('reject').onclick = () => setCaseStatus('rejected'); $('filter').onchange = event => { filter = event.target.value; refreshQueue(); renderCurrent(); }; $('coverage').onclick = () => { coverageMode = true; renderCoverage(); };
$('export-reviewed').onclick = async () => { clearErrors(); try { await flushPendingSave(); const output = await exportReviewedBundle(bundle); download(output, `${bundle.reviewMap.batchName.replace(/[^A-Za-z0-9._-]+/g, '-')}-reviewed.zip`); } catch (error) { showErrors('Backup failed', [errorText(error)]); } }; $('finalize').onclick = async () => { clearErrors(); try { await flushPendingSave(); const output = await finalizeBundle(bundle); download(output.zip, 'flashcards-import-v1.zip'); } catch (error) { showErrors('Finalization blocked', error instanceof ReviewBundleError ? error.issues : [errorText(error)]); } };
window.addEventListener('beforeunload', event => { if (dirty || dirtyBeforeFingerprint || saveTimer || saveInFlight) { event.preventDefault(); event.returnValue = ''; } }); document.addEventListener('keydown', event => { if (!bundle || event.target?.matches?.(inputSelector)) return; if (event.key === 'ArrowLeft') { event.preventDefault(); $('prev').click(); } else if (event.key === 'ArrowRight') { event.preventDefault(); $('next').click(); } else if (event.key === ' ') { event.preventDefault(); revealAnswers = !revealAnswers; renderCurrent(); } else if (event.key.toLowerCase() === 'a') approveCurrent(); else if (event.key.toLowerCase() === 'r') setCaseStatus('needs_review'); else if (event.key.toLowerCase() === 'x') setCaseStatus('rejected'); });

</script>
