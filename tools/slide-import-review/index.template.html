<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash-Cards Slide Import Reviewer</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17202a;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;padding:.6rem .85rem;background:#243b53;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e8edf2;color:#17202a}.danger{color:#b42318}.muted,.small{color:#667085}.small{font-size:.85rem}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe3e8;padding:.7rem 1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.top h1{font-size:1rem;margin:0;margin-right:auto}.drop{margin:1rem;border:2px dashed #aab4c0;border-radius:12px;padding:2rem;text-align:center;background:#fff}.drop.drag{border-color:#243b53}.shell{padding:1rem}.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}.toolbar .spacer{margin-left:auto}.review-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:1rem}.queue{position:sticky;top:5rem;align-self:start;max-height:calc(100vh - 6rem);overflow:auto;background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:.55rem}.queue-heading{display:flex;justify-content:space-between;gap:.5rem;padding:.35rem .4rem .6rem}.queue-item{width:100%;display:flex;justify-content:space-between;gap:.4rem;padding:.55rem .5rem;margin:.1rem 0;background:transparent;color:#17202a;text-align:left;border-radius:7px}.queue-item.selected{background:#e8edf2;outline:2px solid #243b53}.queue-state{font-size:.75rem;border-radius:999px;padding:.15rem .35rem;background:#e9eff7}.queue-state.approved{background:#dcfae6}.queue-state.needs_review{background:#fff3c4}.queue-state.rejected{background:#fee4e2}.review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}.panel,.coverage{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:1rem;min-width:0}.source-panel{position:sticky;top:5rem;align-self:start;max-height:calc(100vh - 6rem);overflow:auto}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:.7rem}.panel h2,.panel h3{margin-top:.25rem}.row{display:flex;gap:.5rem;align-items:center}.between{justify-content:space-between}.badge{border-radius:999px;padding:.25rem .55rem;font-size:.8rem;background:#eef2f6}.approved{background:#dcfae6}.needs_review{background:#fff3c4}.rejected{background:#fee4e2}.pending{background:#e9eff7}label{display:block;font-size:.86rem;font-weight:600;margin:.7rem 0}input,textarea,select{width:100%;border:1px solid #cdd5df;border-radius:7px;padding:.55rem;background:#fff}textarea{resize:vertical}.card{border:1px solid #e1e6eb;border-radius:10px;padding:.8rem;margin:.75rem 0}.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem}.asset-grid .card{margin:0}.learner-image,.source-large{display:block;max-width:100%;max-height:520px;object-fit:contain;margin:.6rem auto;background:#111}.thumbs{display:flex;gap:.5rem;overflow:auto;padding:.5rem 0}.thumb{background:#fff;color:#17202a;border:1px solid #dfe3e8;width:120px;flex:0 0 auto;padding:.35rem}.thumb.selected{outline:2px solid #243b53}.thumb img{width:100%;height:80px;object-fit:cover}.thumb span{font-size:.75rem}.thumb.missing{height:112px;font-size:.75rem}.warnings{margin:.5rem 0}.warn{padding:.5rem;border-left:4px solid #98a2b3;background:#f9fafb;margin:.3rem 0;font-size:.85rem}.warn.blocking{border-color:#b42318;background:#fff0ee}.warn.warning{border-color:#d97706;background:#fff7e6}.notes{border-left:3px solid #667085;background:#f8fafc;padding:.45rem .65rem;margin:.5rem 0;font-size:.86rem}.notes p{margin:.25rem 0}.hidden{display:none}.error-card{background:#fff0ee;border:1px solid #f7b4ad;border-radius:10px;padding:.8rem;margin:1rem}.error-card ul{margin:.45rem 0 0}code{word-break:break-all}.link-button{display:inline;background:none;border:0;padding:0;color:#175cd3;text-decoration:underline}.coverage{overflow:auto}.coverage table{border-collapse:collapse;width:100%}.coverage th,.coverage td{border-bottom:1px solid #e5e7eb;padding:.55rem;text-align:left;vertical-align:top}.coverage tr.issue{background:#fff4ed}.empty{padding:3rem;text-align:center;background:#fff;border-radius:12px}@media(max-width:1100px){.review-layout{grid-template-columns:1fr}.queue,.source-panel{position:static;max-height:none}.queue{display:flex;gap:.3rem;overflow:auto}.queue-heading{display:none}.queue-item{width:auto;min-width:120px}.review-grid{grid-template-columns:1fr}}@media(max-width:600px){.toolbar .spacer{display:none}.toolbar button{flex:1}.top{position:static}}
</style>
</head>
<body>
<header class="top"><h1>Flash-Cards Slide Import Reviewer</h1><span id="batch"></span><span id="persist"></span><label style="margin:0;font-weight:400">Choose review ZIP <input id="zip-input" type="file" accept=".zip,application/zip" style="width:auto"></label></header>
<div id="errors"></div><div id="batch-warning"></div>
<div id="empty-start"><div id="drop" class="drop"><h2>Open a review bundle</h2><p>Drop <code>&lt;batch&gt;-review.zip</code> here, or choose it above. Files stay on this device.</p></div></div>
<main id="review-shell" class="shell" hidden><div class="toolbar"><button id="prev" class="secondary">← Previous</button><span id="position"></span><button id="next" class="secondary">Next →</button><select id="filter" style="width:auto"><option value="all">All Cases</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="needs_review">Needs review</option><option value="rejected">Rejected</option><option value="blocking">Blocking warnings</option><option value="low">Low confidence</option><option value="missing">Missing answers</option><option value="image">Image warnings</option><option value="unresolved">Unresolved questions</option></select><button id="coverage" class="secondary">Source coverage</button><span class="spacer"></span><button id="approve">Approve (A)</button><button id="needs" class="secondary">Needs review (R)</button><button id="reject" class="secondary">Reject (X)</button><button id="export-reviewed" class="secondary">Back up reviewed bundle</button><button id="finalize" aria-label="Finalize Import ZIP">Create Import ZIP</button></div><div class="small">Progress: all <b id="count-all">0</b> · pending <b id="count-pending">0</b> · approved <b id="count-approved">0</b> · needs review <b id="count-needs_review">0</b> · rejected <b id="count-rejected">0</b> · blocking <b id="count-blocking">0</b> · low confidence <b id="count-low">0</b> · missing answers <b id="count-missing">0</b> · image warnings <b id="count-image">0</b> · unresolved <b id="count-unresolved">0</b></div><div id="workspace"></div></main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
