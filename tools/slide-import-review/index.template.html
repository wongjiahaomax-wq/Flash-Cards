<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash-Cards Slide Import Reviewer</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17202a;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{border:0;border-radius:8px;padding:.65rem .9rem;background:#243b53;color:white;cursor:pointer}.secondary{background:#e8edf2;color:#17202a}.danger{color:#b42318}.muted,.small{color:#667085}.small{font-size:.85rem}.top{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid #dfe3e8;padding:.75rem 1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.top h1{font-size:1rem;margin:0;margin-right:auto}.drop{margin:1rem;border:2px dashed #aab4c0;border-radius:12px;padding:2rem;text-align:center;background:white}.drop.drag{border-color:#243b53}.shell{padding:1rem}.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}.toolbar .spacer{margin-left:auto}.review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}.panel,.coverage{background:white;border:1px solid #dfe3e8;border-radius:12px;padding:1rem;min-width:0}.panel h2,.panel h3{margin-top:.25rem}.row{display:flex;gap:.5rem;align-items:center}.between{justify-content:space-between}.badge{border-radius:999px;padding:.25rem .55rem;font-size:.8rem;background:#eef2f6}.approved{background:#dcfae6}.needs_review{background:#fff3c4}.rejected{background:#fee4e2}.pending{background:#e9eff7}label{display:block;font-size:.86rem;font-weight:600;margin:.7rem 0}input,textarea,select{width:100%;border:1px solid #cdd5df;border-radius:7px;padding:.55rem;background:white}textarea{resize:vertical}.card{border:1px solid #e1e6eb;border-radius:10px;padding:.8rem;margin:.75rem 0}.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem}.asset-grid .card{margin:0}.learner-image,.source-large{display:block;max-width:100%;max-height:520px;object-fit:contain;margin:.6rem auto;background:#111}.thumbs{display:flex;gap:.5rem;overflow:auto;padding:.5rem 0}.thumb{background:white;color:#17202a;border:1px solid #dfe3e8;width:120px;flex:0 0 auto;padding:.35rem}.thumb.selected{outline:2px solid #243b53}.thumb img{width:100%;height:80px;object-fit:cover}.thumb span{font-size:.75rem}.warnings{margin:.5rem 0}.warn{padding:.5rem;border-left:4px solid #98a2b3;background:#f9fafb;margin:.3rem 0;font-size:.85rem}.warn.blocking{border-color:#b42318;background:#fff0ee}.warn.warning{border-color:#d97706;background:#fff7e6}.hidden{display:none}.error-card{background:#fff0ee;border:1px solid #f7b4ad;border-radius:10px;padding:.8rem;margin:1rem}.error-card ul{margin:.45rem 0 0}code{word-break:break-all}.coverage{overflow:auto}.coverage table{border-collapse:collapse;width:100%}.coverage th,.coverage td{border-bottom:1px solid #e5e7eb;padding:.55rem;text-align:left;vertical-align:top}.coverage tr.issue{background:#fff4ed}.empty{padding:3rem;text-align:center;background:white;border-radius:12px}@media(max-width:900px){.review-grid{grid-template-columns:1fr}.top{position:static}}
</style></head><body><header class="top"><h1>Flash-Cards Slide Import Reviewer</h1><span id="batch"></span><span id="persist"></span><label style="margin:0;font-weight:400">Choose review ZIP <input id="zip-input" type="file" accept=".zip,application/zip" style="width:auto"></label></header><div id="errors"></div><div id="empty-start"><div id="drop" class="drop"><h2>Open a review bundle</h2><p>Drop <code>&lt;batch&gt;-review.zip</code> here, or choose it above. Files stay on this device.</p></div></div><main id="review-shell" class="shell" hidden><div class="toolbar"><button id="prev" class="secondary">← Previous</button><span id="position"></span><button id="next" class="secondary">Next →</button><select id="filter" style="width:auto"><option value="all">All</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="needs_review">Needs review</option><option value="rejected">Rejected</option><option value="blocking">Blocking warnings</option><option value="low">Low confidence</option><option value="missing">Missing answers</option><option value="image">Image warnings</option><option value="unresolved">Unresolved questions</option></select><button id="coverage" class="secondary">Source coverage</button><span class="spacer"></span><button id="approve">Approve (A)</button><button id="needs" class="secondary">Needs review (R)</button><button id="reject" class="secondary">Reject (X)</button><button id="export-reviewed" class="secondary">Export Reviewed Bundle</button><button id="finalize">Finalize Import ZIP</button></div><div class="small">Counts: all <b id="count-all">0</b> · pending <b id="count-pending">0</b> · approved <b id="count-approved">0</b> · needs review <b id="count-needs_review">0</b> · rejected <b id="count-rejected">0</b> · blocking <b id="count-blocking">0</b> · low confidence <b id="count-low">0</b> · missing answers <b id="count-missing">0</b> · image warnings <b id="count-image">0</b> · unresolved <b id="
