name: PR 166 rebuild standalone reviewer

on:
  push:
    branches:
      - plan/slide-reviewer-compact-qa-ux

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, 'Rebuild standalone reviewer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/slide-reviewer-compact-qa-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run slide-review:test
      - run: npm run slide-review:build
      - name: Commit generated reviewer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/slide-import-review/reviewer.html
          if git diff --cached --quiet; then
            echo "Standalone reviewer already synchronized."
            exit 0
          fi
          git commit -m "Rebuild standalone reviewer"
          git push origin HEAD:plan/slide-reviewer-compact-qa-ux
