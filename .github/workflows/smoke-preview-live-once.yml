name: Smoke live Preview once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-preview-live-once.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Preview boundaries
        shell: bash
        run: |
          set -euo pipefail
          preview='https://flash-cards-preview.mmed-fm-flashcardstest.workers.dev'
          production='https://flash-cards.mmed-fm-flashcardstest.workers.dev'

          check_status() {
            local url="$1"
            local expected="$2"
            local actual
            actual="$(curl --fail-with-body --silent --show-error --output /tmp/body --write-out '%{http_code}' "$url" || true)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Expected HTTP $expected from $url, got $actual"
              cat /tmp/body || true
              exit 1
            fi
            echo "$url -> $actual"
          }

          check_status "$preview/admin" 403
          check_status "$preview/study" 403
          check_status "$preview/api/auth/admin" 403
          check_status "$preview/sign-in" 200
          check_status "$production/sign-in" 200

# One-shot read-only verification after PR #30 deployment.
