name: Audit Preview account once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-preview-account-once.yml

permissions:
  contents: read

jobs:
  audit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Audit Preview identity and disposable content
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_D1_WRITE_TOKEN is not configured."
            exit 1
          fi

          echo '=== Preview Admin identity ==='
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT count(*) AS preview_admin_count, group_concat(substr(email, 1, 2) || '***@' || substr(email, instr(email, '@') + 1)) AS masked_emails, group_concat(role) AS roles, min(createdAt) AS earliest_created_at, max(createdAt) AS latest_created_at FROM user WHERE instr(',' || replace(coalesce(role, ''), ' ', '') || ',', ',preview_admin,') > 0;"

          echo '=== Preview credential account ==='
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT count(*) AS credential_count FROM account a JOIN user u ON u.id = a.userId WHERE a.providerId = 'credential' AND instr(',' || replace(coalesce(u.role, ''), ' ', '') || ',', ',preview_admin,') > 0;"

          echo '=== Preview sessions ==='
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT status, count(*) AS count FROM preview_sessions GROUP BY status ORDER BY status;"

          echo '=== Preview-owned entities ==='
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT (SELECT count(*) FROM cases WHERE preview_session_id IS NOT NULL) AS preview_cases, (SELECT count(*) FROM question_prompts WHERE preview_session_id IS NOT NULL) AS preview_prompts, (SELECT count(*) FROM assets WHERE preview_session_id IS NOT NULL) AS preview_assets;"

# One-shot read-only audit after Preview Admin bootstrap uncertainty.
