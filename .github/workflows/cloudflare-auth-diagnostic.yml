name: Cloudflare auth diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-auth-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check token account access
        run: npx --yes wrangler@4.123.0 whoami
