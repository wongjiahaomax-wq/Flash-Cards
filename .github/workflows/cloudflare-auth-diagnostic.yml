name: Cloudflare auth diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-auth-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
    steps:
      - name: Check token account access
        run: npx --yes wrangler@4.123.0 whoami

      - name: List D1 databases read-only
        run: npx --yes wrangler@4.123.0 d1 list
