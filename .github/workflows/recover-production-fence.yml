name: Recover interrupted production fence

on:
  workflow_run:
    workflows: [Deploy production]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  recover:
    if: ${{ always() && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
      PRODUCTION_WORKER_URL: https://flash-cards.mmed-fm-flashcardstest.workers.dev

    steps:
      - name: Inspect interrupted deployment recovery state
        id: recovery_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/source-jobs.json"

          node <<'NODE'
          const fs = require('node:fs');
          const artifactsPayload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/source-artifacts.json`, 'utf8'));
          const jobsPayload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/source-jobs.json`, 'utf8'));
          const recoveryArtifacts = (artifactsPayload.artifacts ?? []).filter(
            (artifact) => artifact?.name === 'production-cutover-pre-fence' && artifact?.expired !== true
          );
          if (recoveryArtifacts.length > 1) {
            console.error(`Expected at most one pre-fence recovery artifact, found ${recoveryArtifacts.length}.`);
            process.exit(1);
          }

          const preFencePresent = recoveryArtifacts.length === 1;
          const deployJobs = (jobsPayload.jobs ?? []).filter((job) => job?.name === 'deploy');
          let migrationConclusion = 'unknown';
          if (deployJobs.length === 1) {
            const migrationStep = (deployJobs[0].steps ?? []).find(
              (step) => step?.name === 'Apply all pending production D1 migrations'
            );
            if (typeof migrationStep?.conclusion === 'string' && migrationStep.conclusion.length > 0) {
              migrationConclusion = migrationStep.conclusion;
            }
          }

          const safeToRestore = preFencePresent && migrationConclusion === 'skipped';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `pre_fence_present=${preFencePresent}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `migration_conclusion=${migrationConclusion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `safe_to_restore=${safeToRestore}\n`);
          console.log(`Recovery state: preFencePresent=${preFencePresent}, migrationConclusion=${migrationConclusion}, safeToRestore=${safeToRestore}`);
          NODE

      - name: Check out interrupted deployment revision
        if: ${{ steps.recovery_state.outputs.pre_fence_present == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js for recovery verification
        if: ${{ steps.recovery_state.outputs.pre_fence_present == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Inspect public Worker application state
        id: edge_state
        if: ${{ steps.recovery_state.outputs.pre_fence_present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 5); do
            probe_file="$RUNNER_TEMP/recovery-edge-probe.json"
            rm -f "$probe_file"
            if node scripts/production-fence-recovery.mjs probe \
              --base-url "$PRODUCTION_WORKER_URL" \
              > "$probe_file"; then
              echo "needs_recovery=false" >> "$GITHUB_OUTPUT"
              echo "fence_active=false" >> "$GITHUB_OUTPUT"
              echo "Public Worker already proves the unfenced /study application contract."
              exit 0
            fi

            if [ -s "$probe_file" ] && node -e '
              const fs=require("node:fs");
              const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.exit(String(value.fence_header ?? "").toLowerCase() === "active" ? 0 : 1);
            ' "$probe_file"; then
              echo "needs_recovery=true" >> "$GITHUB_OUTPUT"
              echo "fence_active=true" >> "$GITHUB_OUTPUT"
              echo "Temporary learner fence is still active at the public Worker endpoint."
              exit 0
            fi

            echo "Public Worker is neither the verified application nor the explicit temporary fence (attempt ${attempt}/5)."
            if [ "$attempt" -lt 5 ]; then
              sleep 2
            fi
          done
          echo "::error::Public Worker state is indeterminate. Header absence alone is not recovery proof; refusing automatic rollback."
          exit 1

      - name: Refuse unsafe application rollback after D1 migration may have started
        if: ${{ steps.edge_state.outputs.needs_recovery == 'true' && steps.recovery_state.outputs.safe_to_restore != 'true' }}
        shell: bash
        run: |
          echo "::error::Temporary learner fence is still active, but automatic Worker rollback is unsafe because the D1 migration step conclusion is '${{ steps.recovery_state.outputs.migration_conclusion }}'. Manual recovery is required."
          exit 1

      - name: Download verified pre-fence recovery record
        if: ${{ steps.edge_state.outputs.needs_recovery == 'true' && steps.recovery_state.outputs.safe_to_restore == 'true' }}
        uses: actions/download-artifact@v5
        with:
          name: production-cutover-pre-fence
          path: ${{ runner.temp }}/production-cutover-recovery
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate rollback target provenance
        id: rollback_target
        if: ${{ steps.edge_state.outputs.needs_recovery == 'true' && steps.recovery_state.outputs.safe_to_restore == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/production-cutover-recovery/pre-fence-recovery.json"
          if [ ! -f "$record" ]; then
            echo "::error::Verified structured pre-fence recovery record is missing. Legacy bare Worker-ID artifacts are not accepted."
            exit 1
          fi

          rollback_version="$(node scripts/production-fence-recovery.mjs verify-record \
            --file "$record" \
            --base-url "$PRODUCTION_WORKER_URL" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --sha "${{ github.event.workflow_run.head_sha }}")"
          echo "version_id=${rollback_version}" >> "$GITHUB_OUTPUT"
          echo "Validated positively verified recovery target ${rollback_version}."

      - name: Install deployment dependencies
        if: ${{ steps.rollback_target.outputs.version_id != '' }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify Cloudflare deploy credential
        if: ${{ steps.rollback_target.outputs.version_id != '' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_API_TOKEN is required for Production fence recovery."
            exit 1
          fi

      - name: Restore pre-fence Worker after interrupted pre-migration cutover
        if: ${{ steps.rollback_target.outputs.version_id != '' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          rollback_version="${{ steps.rollback_target.outputs.version_id }}"
          ./node_modules/.bin/wrangler rollback "$rollback_version" \
            --name flash-cards \
            --message "Automatic recovery after interrupted pre-migration learner cutover fence from run ${{ github.event.workflow_run.id }}"

      - name: Verify recovered Worker control plane and public edge
        if: ${{ steps.rollback_target.outputs.version_id != '' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          rollback_version="${{ steps.rollback_target.outputs.version_id }}"
          status_json="$(./node_modules/.bin/wrangler deployments status --name flash-cards --json)"
          printf '%s' "$status_json" |
            node scripts/production-worker-deployment.mjs verify-version "$rollback_version"
          echo
          echo "Verified recovered Worker control plane at ${rollback_version}."

          # Control-plane restoration can precede workers.dev edge propagation.
          # Recovery is complete only when the positive /study application
          # redirect contract is visible. Missing fence headers and generic 5xx
          # responses are not sufficient evidence of recovery.
          for attempt in $(seq 1 60); do
            if node scripts/production-fence-recovery.mjs probe \
              --base-url "$PRODUCTION_WORKER_URL" \
              > /tmp/recovered-study-probe.json; then
              echo "Verified recovered application response at the public Worker endpoint on attempt ${attempt}."
              cat /tmp/recovered-study-probe.json
              exit 0
            fi
            echo "Recovered Worker application response not visible yet (attempt ${attempt}/60)."
            if [ "$attempt" -lt 60 ]; then
              sleep 5
            fi
          done
          echo "::error::Recovered Worker is recorded at 100% traffic, but the public endpoint did not prove the recovered application contract after five minutes."
          exit 1