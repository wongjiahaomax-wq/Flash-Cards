name: Deploy production

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations on an ordinary post-v2 deployment. The first v2 cutover always migrates.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
      PRODUCTION_WORKER_URL: https://flash-cards.mmed-fm-flashcardstest.workers.dev

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deployment must be dispatched from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Cloudflare read/deploy credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          set -euo pipefail
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_D1_READ_TOKEN; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::GitHub repository secret ${secret_name} is required."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check database migrations
        run: npm run db:check

      - name: Run tests
        run: npm test

      - name: Run Svelte checks
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Smoke test local D1 and Better Auth
        run: node scripts/local-auth-smoke.mjs

      - name: Run multi-System v2 migrated-D1 scope guard acceptance
        run: npm run multi-system:d1-acceptance

      - name: Run multi-System v2 migrated-D1 lifecycle acceptance
        run: npm run multi-system:d1-lifecycle-acceptance

      - name: Run multi-System v2 supported JS/browser-envelope benchmark
        run: npm run multi-system:benchmark

      - name: Run multi-System v2 supported-envelope D1 trigger benchmark
        run: npm run multi-system:d1-trigger-benchmark

      - name: Detect whether the one-time v2 cutover is still required
        id: cutover
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          set -euo pipefail

          # D1 inspection must itself succeed. Operational read/auth failures stop
          # before any Production fence is installed.
          guard_json="$(node scripts/multi-system-v2-guard-verify.mjs --remote --inspect)"
          guard_status="$(node -e 'const value=JSON.parse(process.argv[1]); const status=value?.inspection?.status; if(!["v2","legacy","missing"].includes(status)) process.exit(1); process.stdout.write(status);' "$guard_json")"

          # Schema-v2 is not enough to prove that the clean browser/runtime cutover
          # completed. A successful earlier cutover must also expose an unfenced v2
          # runtime carrying an immutable commit SHA. HTTP legacy/maintenance states
          # are treated as incomplete; transport failures stop before mutation.
          if ! runtime_http="$(curl --silent --show-error --output /tmp/runtime-cutover-status.json --write-out '%{http_code}' "$PRODUCTION_WORKER_URL/api/runtime-cutover-status")"; then
            echo "::error::Unable to inspect the currently deployed Production runtime. No cutover action was taken."
            exit 1
          fi

          runtime_status="absent"
          runtime_build_sha=""
          if [ "$runtime_http" = "200" ]; then
            runtime_eval="$(node -e '
              let value;
              try { value = JSON.parse(process.argv[1]); } catch { process.stdout.write("incomplete|"); process.exit(0); }
              const sha = typeof value?.learnerRuntimeBuildSha === "string" ? value.learnerRuntimeBuildSha.toLowerCase() : "";
              const complete = value?.learnerRuntimeCutoverVersion === 2
                && value?.learnerRuntimeScopeVersion === 2
                && value?.learnerRuntimeWriteFence === false
                && /^[0-9a-f]{40}$/.test(sha);
              process.stdout.write(`${complete ? "complete" : "incomplete"}|${sha}`);
            ' "$(cat /tmp/runtime-cutover-status.json)")"
            runtime_status="${runtime_eval%%|*}"
            runtime_build_sha="${runtime_eval#*|}"
          fi

          if [ "$guard_status" = "v2" ] && [ "$runtime_status" = "complete" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Existing Production D1 guard and deployed runtime both prove a completed v2 cutover."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Production cutover is incomplete: guard=${guard_status}, runtime=${runtime_status}, http=${runtime_http}. The fenced exact-zero sequence is mandatory."
          fi
          echo "guard_status=${guard_status}" >> "$GITHUB_OUTPUT"
          echo "runtime_status=${runtime_status}" >> "$GITHUB_OUTPUT"
          echo "prior_build_sha=${runtime_build_sha}" >> "$GITHUB_OUTPUT"

      - name: Require D1 write credential when migration is required
        if: ${{ steps.cutover.outputs.required == 'true' || inputs.apply_migrations == true }}
        shell: bash
        env:
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_D1_WRITE_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_D1_WRITE_TOKEN is required for this deployment."
            exit 1
          fi

      - name: Capture pre-fence Worker version
        id: pre_fence
        if: ${{ steps.cutover.outputs.required == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          status_json="$(./node_modules/.bin/wrangler deployments status --name flash-cards --json)"
          version_id="$(
            printf '%s' "$status_json" |
              node scripts/production-worker-deployment.mjs current-version
          )"
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"
          echo "Captured pre-fence Worker version ${version_id}."

      - name: Write pre-fence recovery record
        if: ${{ steps.cutover.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cutover-recovery
          printf '%s\n' "${{ steps.pre_fence.outputs.version_id }}" > .cutover-recovery/pre-fence-version.txt

      - name: Upload pre-fence recovery record
        if: ${{ steps.cutover.outputs.required == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-cutover-pre-fence
          path: .cutover-recovery/pre-fence-version.txt
          if-no-files-found: error
          retention-days: 7

      - name: Install temporary learner write fence Worker
        id: install_fence
        if: ${{ steps.cutover.outputs.required == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .cutover-fence
          cat > .cutover-fence/worker.mjs <<'EOF'
          export default {
            fetch() {
              return new Response('Learner runtime temporarily closed for the multi-System v2 cutover.', {
                status: 503,
                headers: {
                  'Cache-Control': 'no-store',
                  'X-Learner-Runtime-Fence': 'active'
                }
              });
            }
          };
          EOF
          cat > .cutover-fence/wrangler.json <<'EOF'
          {
            "name": "flash-cards",
            "main": "./worker.mjs",
            "compatibility_date": "2026-08-14",
            "workers_dev": true
          }
          EOF
          ./node_modules/.bin/wrangler deploy --config .cutover-fence/wrangler.json

      - name: Verify temporary write fence
        id: verify_fence
        if: ${{ steps.cutover.outputs.required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            headers="$(mktemp)"
            status=""
            if status="$(curl --silent --show-error --output /tmp/fence-body.txt --dump-header "$headers" --write-out '%{http_code}' "$PRODUCTION_WORKER_URL/study")" \
              && [ "$status" = "503" ] \
              && grep -qi '^X-Learner-Runtime-Fence: active' "$headers"; then
              rm -f "$headers"
              echo "Verified temporary write fence on attempt ${attempt}."
              exit 0
            fi
            rm -f "$headers"
            echo "Temporary write fence not visible yet (attempt ${attempt}/10, status=${status:-curl-error})."
            if [ "$attempt" -lt 10 ]; then
              sleep 2
            fi
          done
          echo "::error::Temporary learner write fence did not become observable after 10 attempts."
          exit 1

      - name: Require exact zero Production learner runtime data
        id: zero_runtime_data
        if: ${{ steps.cutover.outputs.required == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: npm run multi-system:cutover-gate -- --remote

      - name: Restore pre-fence Worker after pre-migration cutover failure or cancellation
        if: ${{ always() && steps.cutover.outputs.required == 'true' && steps.pre_fence.outputs.version_id != '' && steps.install_fence.outcome != 'skipped' && (cancelled() || steps.install_fence.outcome == 'failure' || steps.install_fence.outcome == 'cancelled' || steps.verify_fence.outcome == 'failure' || steps.verify_fence.outcome == 'cancelled' || steps.zero_runtime_data.outcome == 'failure' || steps.zero_runtime_data.outcome == 'cancelled') }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          rollback_version="${{ steps.pre_fence.outputs.version_id }}"
          ./node_modules/.bin/wrangler rollback "$rollback_version" \
            --name flash-cards \
            --message "Automatic pre-migration rollback after failed or cancelled temporary learner cutover fence for ${GITHUB_SHA}"

      - name: Verify pre-fence Worker restoration
        if: ${{ always() && steps.cutover.outputs.required == 'true' && steps.pre_fence.outputs.version_id != '' && steps.install_fence.outcome != 'skipped' && (cancelled() || steps.install_fence.outcome == 'failure' || steps.install_fence.outcome == 'cancelled' || steps.verify_fence.outcome == 'failure' || steps.verify_fence.outcome == 'cancelled' || steps.zero_runtime_data.outcome == 'failure' || steps.zero_runtime_data.outcome == 'cancelled') }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          rollback_version="${{ steps.pre_fence.outputs.version_id }}"
          status_json="$(./node_modules/.bin/wrangler deployments status --name flash-cards --json)"
          printf '%s' "$status_json" |
            node scripts/production-worker-deployment.mjs verify-version "$rollback_version"
          echo
          echo "Verified Production Worker control plane restored to ${rollback_version}."

          for attempt in $(seq 1 10); do
            headers="$(mktemp)"
            status=""
            if status="$(curl --silent --show-error --output /tmp/restored-worker-body.txt --dump-header "$headers" --write-out '%{http_code}' "$PRODUCTION_WORKER_URL/study")"; then
              if ! grep -qi '^X-Learner-Runtime-Fence: active' "$headers"; then
                rm -f "$headers"
                echo "Verified temporary learner fence disappeared from the public Worker endpoint on attempt ${attempt}."
                exit 0
              fi
            fi
            rm -f "$headers"
            echo "Pre-fence Worker not visible at the public endpoint yet (attempt ${attempt}/10, status=${status:-curl-error})."
            if [ "$attempt" -lt 10 ]; then
              sleep 2
            fi
          done
          echo "::error::Control-plane rollback succeeded but the public Worker endpoint still exposes the temporary learner fence."
          exit 1

      - name: Apply all pending production D1 migrations
        if: ${{ steps.cutover.outputs.required == 'true' || inputs.apply_migrations == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: ./node_modules/.bin/wrangler d1 migrations apply DB --remote

      - name: Verify v2 Active Review D1 guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: npm run multi-system:guard-verify -- --remote

      - name: Deploy v2 Worker while learner writes remain fenced
        if: ${{ steps.cutover.outputs.required == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          ./node_modules/.bin/wrangler deploy
          --var LEARNER_RUNTIME_WRITE_FENCE:true
          --var APP_BUILD_SHA:${GITHUB_SHA}

      - name: Deploy Worker
        if: ${{ steps.cutover.outputs.required != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --var APP_BUILD_SHA:${GITHUB_SHA}

      - name: Non-mutating verification while v2 Worker is fenced
        if: ${{ steps.cutover.outputs.required == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: |
          set -euo pipefail
          status_json="$(curl --fail --silent --show-error "$PRODUCTION_WORKER_URL/api/runtime-cutover-status")"
          node -e '
            const value=JSON.parse(process.argv[1]);
            const expected=process.argv[2].toLowerCase();
            if(value.learnerRuntimeCutoverVersion!==2
              || value.learnerRuntimeScopeVersion!==2
              || value.learnerRuntimeWriteFence!==true
              || value.learnerRuntimeBuildSha!==expected) process.exit(1);
          ' "$status_json" "$GITHUB_SHA"
          npm run multi-system:guard-verify -- --remote
          npm run multi-system:cutover-gate -- --remote

      - name: Reopen learner runtime with v2 Worker
        if: ${{ steps.cutover.outputs.required == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --var APP_BUILD_SHA:${GITHUB_SHA}

      - name: Verify deployed v2 runtime is open
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(curl --fail --silent --show-error "$PRODUCTION_WORKER_URL/api/runtime-cutover-status")"
          node -e '
            const value=JSON.parse(process.argv[1]);
            const expected=process.argv[2].toLowerCase();
            if(value.learnerRuntimeCutoverVersion!==2
              || value.learnerRuntimeScopeVersion!==2
              || value.learnerRuntimeWriteFence!==false
              || value.learnerRuntimeBuildSha!==expected) process.exit(1);
          ' "$status_json" "$GITHUB_SHA"

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Ref: `${GITHUB_REF}`"
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Worker: ${PRODUCTION_WORKER_URL}"
            echo "- Pre-deploy v2 D1 guard: `${{ steps.cutover.outputs.guard_status }}`"
            echo "- Pre-deploy v2 runtime completion state: `${{ steps.cutover.outputs.runtime_status }}`"
            echo "- Prior deployed v2 build: `${{ steps.cutover.outputs.prior_build_sha }}`"
            echo "- Multi-System v2 fenced cutover required: `${{ steps.cutover.outputs.required }}`"
            echo "- Ordinary post-cutover migration input: `${{ inputs.apply_migrations }}`"
            echo "- First/incomplete-cutover migration policy: `mandatory`"
            echo "- Deployed build identity: `${GITHUB_SHA}`"
            echo "- v2 Active Review guard: `verified`"
            echo "- Learner runtime write fence after verification: `open`"
          } >> "$GITHUB_STEP_SUMMARY"
