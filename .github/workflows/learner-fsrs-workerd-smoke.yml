name: Learner FSRS workerd smoke

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'src/lib/server/learning/fsrs-scheduler.js'
      - 'scripts/learner-fsrs-workerd-smoke.mjs'
      - '.github/workflows/learner-fsrs-workerd-smoke.yml'

permissions:
  contents: read

jobs:
  fsrs-workerd-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute pinned FSRS scheduler inside workerd
        run: npm run fsrs:workerd-smoke
