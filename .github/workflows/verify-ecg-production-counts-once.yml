name: Verify exact ECG production counts once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-ecg-production-counts-once.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      STATUS_CONTEXT: ecg-production-counts
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state pending --arg context "${STATUS_CONTEXT}" --arg description 'Verifying exact ECG Case/Asset/link counts in production D1.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify production ECG counts
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Production D1 read credentials are not configured."
            exit 1
          fi

          run_query() {
            local sql="$1"
            npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "$sql"
          }

          assert_eq() {
            local actual="$1"
            local expected="$2"
            local label="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${label}: expected ${expected}, got ${actual:-<empty>}."
              exit 1
            fi
            echo "PASS: ${label} = ${actual}"
          }

          verify_batch() {
            local package_id="$1"
            local expected="$2"
            local case_prefix="fc-import:${package_id}:case:"
            local asset_prefix="fc-import:${package_id}:asset:"

            echo "::group::${package_id} CASES"
            local cases_json total_cases active_cases
            cases_json=$(run_query "
              SELECT
                COUNT(*) AS total_cases,
                COALESCE(SUM(CASE WHEN is_active = 1 AND preview_session_id IS NULL THEN 1 ELSE 0 END), 0) AS active_cases
              FROM cases
              WHERE substr(id, 1, length('${case_prefix}')) = '${case_prefix}';
            ")
            printf '%s\n' "$cases_json"
            total_cases=$(jq -r '.[0].results[0].total_cases // empty' <<<"$cases_json")
            active_cases=$(jq -r '.[0].results[0].active_cases // empty' <<<"$cases_json")
            assert_eq "$total_cases" "$expected" "${package_id} Case rows"
            assert_eq "$active_cases" "$expected" "${package_id} active production Cases"
            echo "::endgroup::"

            echo "::group::${package_id} ASSETS"
            local assets_json total_assets active_assets named_ecgs
            assets_json=$(run_query "
              SELECT
                COUNT(*) AS total_assets,
                COALESCE(SUM(CASE WHEN is_active = 1 AND preview_session_id IS NULL AND type = 'image' THEN 1 ELSE 0 END), 0) AS active_assets,
                COALESCE(SUM(CASE WHEN instr(COALESCE(original_filename, ''), ' — ECG 01.') > 0 THEN 1 ELSE 0 END), 0) AS named_ecgs
              FROM assets
              WHERE substr(id, 1, length('${asset_prefix}')) = '${asset_prefix}';
            ")
            printf '%s\n' "$assets_json"
            total_assets=$(jq -r '.[0].results[0].total_assets // empty' <<<"$assets_json")
            active_assets=$(jq -r '.[0].results[0].active_assets // empty' <<<"$assets_json")
            named_ecgs=$(jq -r '.[0].results[0].named_ecgs // empty' <<<"$assets_json")
            assert_eq "$total_assets" "$expected" "${package_id} Asset rows"
            assert_eq "$active_assets" "$expected" "${package_id} active production image Assets"
            assert_eq "$named_ecgs" "$expected" "${package_id} Case-aligned ECG filenames"
            echo "::endgroup::"

            echo "::group::${package_id} LINKS"
            local links_json links linked_cases linked_assets
            links_json=$(run_query "
              SELECT
                COUNT(*) AS links,
                COUNT(DISTINCT case_id) AS linked_cases,
                COUNT(DISTINCT asset_id) AS linked_assets
              FROM case_assets
              WHERE substr(case_id, 1, length('${case_prefix}')) = '${case_prefix}'
                AND substr(asset_id, 1, length('${asset_prefix}')) = '${asset_prefix}';
            ")
            printf '%s\n' "$links_json"
            links=$(jq -r '.[0].results[0].links // empty' <<<"$links_json")
            linked_cases=$(jq -r '.[0].results[0].linked_cases // empty' <<<"$links_json")
            linked_assets=$(jq -r '.[0].results[0].linked_assets // empty' <<<"$links_json")
            assert_eq "$links" "$expected" "${package_id} Case↔ECG links"
            assert_eq "$linked_cases" "$expected" "${package_id} distinct linked Cases"
            assert_eq "$linked_assets" "$expected" "${package_id} distinct linked ECG Assets"
            echo "::endgroup::"
          }

          verify_batch "ecg-anki-batch-01-20260816" "13"
          verify_batch "ecg-anki-batch-02-20260816" "51"

          echo "::group::MAPPED CALCIUM CASES"
          calcium_json=$(run_query "
            WITH mapped(case_id) AS (
              VALUES
                ('b11b6a14-c55e-4d70-849c-ce1c8953a38f'),
                ('b1f4870e-52fe-4d26-bbea-851ec64357a7')
            ),
            active_case_images AS (
              SELECT ca.case_id, a.id AS asset_id
              FROM case_assets ca
              JOIN assets a ON a.id = ca.asset_id
              WHERE a.type = 'image' AND a.is_active = 1 AND a.preview_session_id IS NULL
              UNION
              SELECT sg.case_id, a.id AS asset_id
              FROM stimulus_groups sg
              JOIN stimulus_group_options sgo ON sgo.stimulus_group_id = sg.id
              JOIN assets a ON a.id = sgo.asset_id
              WHERE sg.is_active = 1 AND sgo.is_active = 1
                AND a.type = 'image' AND a.is_active = 1 AND a.preview_session_id IS NULL
            )
            SELECT
              m.case_id,
              ca.title,
              ca.is_active,
              ca.preview_session_id,
              COUNT(DISTINCT i.asset_id) AS active_image_count
            FROM mapped m
            LEFT JOIN cases ca ON ca.id = m.case_id
            LEFT JOIN active_case_images i ON i.case_id = m.case_id
            GROUP BY m.case_id, ca.title, ca.is_active, ca.preview_session_id
            ORDER BY m.case_id;
          ")
          printf '%s\n' "$calcium_json"

          calcium_rows=$(jq -r '.[0].results | length' <<<"$calcium_json")
          valid_calcium=$(jq -r '[.[0].results[] | select(.title != null and .is_active == 1 and .preview_session_id == null and (.active_image_count | tonumber) >= 1)] | length' <<<"$calcium_json")
          assert_eq "$calcium_rows" "2" "mapped calcium Case rows"
          assert_eq "$valid_calcium" "2" "mapped calcium Cases active with production images"
          echo "::endgroup::"

          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ECG production count verification passed

          - Batch 01: 13 active production Cases, 13 active ECG Assets, 13 Case↔ECG links.
          - Batch 02: 51 active production Cases, 51 active ECG Assets, 51 Case↔ECG links.
          - Both mapped pre-existing calcium Cases are active and have at least one active production image.
          - Combined source accounting: 13 + 51 + 2 = 66 notes represented.

          This workflow is read-only.
          EOF

      - name: Publish successful verification status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state success --arg context "${STATUS_CONTEXT}" --arg description 'All 66 ECG source notes are represented in production.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Publish failed verification status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state failure --arg context "${STATUS_CONTEXT}" --arg description 'Exact ECG production count verification failed; inspect linked run.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
