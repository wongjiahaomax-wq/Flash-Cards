name: Production content snapshot

on:
  workflow_dispatch:
    inputs:
      include_topic_questions:
        description: Include reusable Topic question prompts and answer previews
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select and verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi

          if [ -n "${CLOUDFLARE_D1_READ_TOKEN:-}" ]; then
            echo "::notice::Using dedicated CLOUDFLARE_D1_READ_TOKEN for the production snapshot."
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_D1_READ_TOKEN}" >> "$GITHUB_ENV"
            echo "SNAPSHOT_AUTH_SOURCE=dedicated D1 read token" >> "$GITHUB_ENV"
          elif [ -n "${CLOUDFLARE_DEPLOY_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_D1_READ_TOKEN is not configured; using CLOUDFLARE_API_TOKEN as a compatibility fallback."
            echo "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_DEPLOY_TOKEN}" >> "$GITHUB_ENV"
            echo "SNAPSHOT_AUTH_SOURCE=deployment token fallback" >> "$GITHUB_ENV"
          else
            echo "::error::Configure CLOUDFLARE_D1_READ_TOKEN (preferred) or CLOUDFLARE_API_TOKEN in repository secrets."
            exit 1
          fi

      - name: Snapshot Topics and Case routes
        shell: bash
        run: |
          set -euo pipefail

          run_query() {
            local label="$1"
            local sql="$2"
            local output
            local status

            echo "::group::${label}"
            set +e
            output=$(./node_modules/.bin/wrangler d1 execute DB --remote --json --command "$sql" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              if printf '%s\n' "$output" | grep -q "code: 7403"; then
                echo "::error::Cloudflare rejected access to the configured D1 account/database (error 7403)."
                if [ "${SNAPSHOT_AUTH_SOURCE:-}" = "deployment token fallback" ]; then
                  echo "::error::The fallback deployment token may not have D1 Read access. Create a least-privilege Cloudflare token with D1 Read permission for the account that owns flash-cards-db, then save it as the GitHub secret CLOUDFLARE_D1_READ_TOKEN. Also verify CLOUDFLARE_ACCOUNT_ID is the owning account ID."
                else
                  echo "::error::Verify CLOUDFLARE_D1_READ_TOKEN has D1 Read permission for the account that owns flash-cards-db and verify CLOUDFLARE_ACCOUNT_ID is that same account ID."
                fi
              fi
              return "$status"
            fi
          }

          echo "Production D1 content snapshot"
          echo "Generated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Credential source: ${SNAPSHOT_AUTH_SOURCE}"
          echo

          run_query "TOPICS" "
            SELECT
              id,
              name,
              slug,
              description_md,
              parent_id,
              is_active
            FROM concepts
            ORDER BY is_active DESC, name, id;
          "

          run_query "CASE_TOPIC_ROUTES" "
            SELECT
              ca.id AS case_id,
              ca.title AS case_title,
              substr(
                replace(replace(COALESCE(ca.vignette_md, ''), char(10), ' '), char(13), ' '),
                1,
                300
              ) AS vignette_preview,
              ca.is_active AS case_is_active,
              cc.concept_id AS topic_id,
              c.name AS topic_name,
              c.is_active AS topic_is_active,
              cc.role AS topic_role
            FROM cases ca
            JOIN case_concepts cc ON cc.case_id = ca.id
            JOIN concepts c ON c.id = cc.concept_id
            WHERE ca.preview_session_id IS NULL
            ORDER BY
              ca.is_active DESC,
              ca.title,
              CASE cc.role WHEN 'primary' THEN 0 ELSE 1 END,
              c.name,
              c.id;
          "

      - name: Snapshot reusable Topic questions
        if: ${{ inputs.include_topic_questions }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::TOPIC_QUESTIONS"
          ./node_modules/.bin/wrangler d1 execute DB --remote --json --command "
            SELECT
              cq.concept_id AS topic_id,
              c.name AS topic_name,
              qp.id AS prompt_id,
              qp.prompt_md,
              substr(COALESCE(cq.answer_md, ''), 1, 500) AS answer_preview,
              cq.inherit_to_descendants,
              cq.is_active AS topic_question_is_active,
              qp.is_active AS prompt_is_active
            FROM concept_questions cq
            JOIN concepts c ON c.id = cq.concept_id
            JOIN question_prompts qp ON qp.id = cq.question_prompt_id
            ORDER BY c.name, qp.prompt_md, qp.id;
          "
          echo "::endgroup::"

      - name: Record safety boundary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Production content snapshot

          This manually triggered workflow queried only learning-content tables using hard-coded `SELECT` statements.

          Included by default:
          - `concepts`
          - production-owned `cases` where `preview_session_id IS NULL`
          - `case_concepts` routes for those production-owned Cases

          Optional:
          - `concept_questions`
          - `question_prompts`

          It does not query Better Auth, users, sessions, learner Reviews, or progress data.
          EOF
