name: Diagnose ECG production import once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-ecg-production-once.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      STATUS_CONTEXT: ecg-production-diagnostic
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state pending --arg context "${STATUS_CONTEXT}" --arg description 'Reading exact ECG import state from production D1.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read production D1 ECG state
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_D1_READ_TOKEN is not configured."
            exit 1
          fi

          run_query() {
            local label="$1"
            local sql="$2"
            echo "::group::${label}"
            npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "$sql"
            echo "::endgroup::"
          }

          run_query "IMPORT_JOBS" "
            SELECT
              package_id,
              package_sha256,
              status,
              phase,
              cursor,
              processed_count,
              total_count,
              completed_at,
              last_error
            FROM import_jobs
            WHERE package_id IN (
              'ecg-anki-batch-01-20260816',
              'ecg-anki-batch-02-20260816'
            )
            ORDER BY package_id, created_at;
          "

          run_query "BATCH_01_COUNTS" "
            SELECT
              (SELECT COUNT(*) FROM cases
                WHERE id LIKE 'fc-import:ecg-anki-batch-01-20260816:case:%') AS case_rows,
              (SELECT COUNT(*) FROM cases
                WHERE id LIKE 'fc-import:ecg-anki-batch-01-20260816:case:%'
                  AND is_active = 1 AND preview_session_id IS NULL) AS active_cases,
              (SELECT COUNT(*) FROM assets
                WHERE id LIKE 'fc-import:ecg-anki-batch-01-20260816:asset:%'
                  AND storage_key LIKE 'teaching-images/import/ecg-anki-batch-01-20260816/%') AS asset_rows,
              (SELECT COUNT(*) FROM assets
                WHERE id LIKE 'fc-import:ecg-anki-batch-01-20260816:asset:%'
                  AND storage_key LIKE 'teaching-images/import/ecg-anki-batch-01-20260816/%'
                  AND is_active = 1 AND preview_session_id IS NULL AND type = 'image') AS active_assets,
              (SELECT COUNT(*) FROM assets
                WHERE id LIKE 'fc-import:ecg-anki-batch-01-20260816:asset:%'
                  AND original_filename LIKE '% — ECG 01.%') AS case_aligned_names,
              (SELECT COUNT(*) FROM case_assets
                WHERE case_id LIKE 'fc-import:ecg-anki-batch-01-20260816:case:%'
                  AND asset_id LIKE 'fc-import:ecg-anki-batch-01-20260816:asset:%') AS case_asset_links;
          "

          run_query "BATCH_02_COUNTS" "
            SELECT
              (SELECT COUNT(*) FROM cases
                WHERE id LIKE 'fc-import:ecg-anki-batch-02-20260816:case:%') AS case_rows,
              (SELECT COUNT(*) FROM cases
                WHERE id LIKE 'fc-import:ecg-anki-batch-02-20260816:case:%'
                  AND is_active = 1 AND preview_session_id IS NULL) AS active_cases,
              (SELECT COUNT(*) FROM assets
                WHERE id LIKE 'fc-import:ecg-anki-batch-02-20260816:asset:%'
                  AND storage_key LIKE 'teaching-images/import/ecg-anki-batch-02-20260816/%') AS asset_rows,
              (SELECT COUNT(*) FROM assets
                WHERE id LIKE 'fc-import:ecg-anki-batch-02-20260816:asset:%'
                  AND storage_key LIKE 'teaching-images/import/ecg-anki-batch-02-20260816/%'
                  AND is_active = 1 AND preview_session_id IS NULL AND type = 'image') AS active_assets,
              (SELECT COUNT(*) FROM assets
                WHERE id LIKE 'fc-import:ecg-anki-batch-02-20260816:asset:%'
                  AND original_filename LIKE '% — ECG 01.%') AS case_aligned_names,
              (SELECT COUNT(*) FROM case_assets
                WHERE case_id LIKE 'fc-import:ecg-anki-batch-02-20260816:case:%'
                  AND asset_id LIKE 'fc-import:ecg-anki-batch-02-20260816:asset:%') AS case_asset_links;
          "

          run_query "MAPPED_CALCIUM_CASES" "
            WITH mapped(case_id) AS (
              VALUES
                ('b11b6a14-c55e-4d70-849c-ce1c8953a38f'),
                ('b1f4870e-52fe-4d26-bbea-851ec64357a7')
            ),
            active_case_images AS (
              SELECT ca.case_id, a.id AS asset_id
              FROM case_assets ca
              JOIN assets a ON a.id = ca.asset_id
              WHERE a.type = 'image' AND a.is_active = 1 AND a.preview_session_id IS NULL
              UNION
              SELECT sg.case_id, a.id AS asset_id
              FROM stimulus_groups sg
              JOIN stimulus_group_options sgo ON sgo.stimulus_group_id = sg.id
              JOIN assets a ON a.id = sgo.asset_id
              WHERE sg.is_active = 1 AND sgo.is_active = 1
                AND a.type = 'image' AND a.is_active = 1 AND a.preview_session_id IS NULL
            )
            SELECT
              m.case_id,
              ca.title,
              ca.is_active,
              ca.preview_session_id,
              COUNT(DISTINCT i.asset_id) AS active_image_count
            FROM mapped m
            LEFT JOIN cases ca ON ca.id = m.case_id
            LEFT JOIN active_case_images i ON i.case_id = m.case_id
            GROUP BY m.case_id, ca.title, ca.is_active, ca.preview_session_id
            ORDER BY m.case_id;
          "

          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ECG production diagnostic

          This run prints exact read-only production D1 rows for the two reviewed ECG import jobs, their deterministic imported Case/Asset/link counts, and the two pre-existing mapped calcium Cases.

          No D1/R2/auth/Review mutation is performed.
          EOF

      - name: Publish successful diagnostic status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state success --arg context "${STATUS_CONTEXT}" --arg description 'Production D1 ECG diagnostic completed; inspect exact query output.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Publish failed diagnostic status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state failure --arg context "${STATUS_CONTEXT}" --arg description 'Production D1 ECG diagnostic failed; inspect the linked run.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
