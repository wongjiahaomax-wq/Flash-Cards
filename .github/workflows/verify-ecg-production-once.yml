name: Verify ECG production import once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-ecg-production-once.yml

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      STATUS_CONTEXT: ecg-production-audit

    steps:
      - name: Mark audit pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state pending --arg context "${STATUS_CONTEXT}" --arg description 'Checking ECG Batch 01, Batch 02, and mapped calcium Cases in production D1.' '{state:$state,context:$context,description:$description}')" >/dev/null

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Audit production ECG import
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_D1_READ_TOKEN is not configured."
            exit 1
          fi

          run_query() {
            local sql="$1"
            npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "$sql"
          }

          assert_eq() {
            local actual="$1"
            local expected="$2"
            local label="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${label}: expected ${expected}, got ${actual:-<empty>}."
              exit 1
            fi
            echo "PASS: ${label} = ${actual}"
          }

          audit_batch() {
            local package_id="$1"
            local package_sha="$2"
            local expected="$3"

            echo "::group::${package_id}"

            local job_json status sha
            job_json=$(run_query "
              SELECT
                package_sha256,
                status,
                phase,
                processed_count,
                total_count,
                completed_at,
                last_error
              FROM import_jobs
              WHERE package_id = '${package_id}'
              ORDER BY created_at DESC
              LIMIT 1;
            ")
            printf '%s\n' "$job_json"
            status=$(jq -r '.[0].results[0].status // empty' <<<"$job_json")
            sha=$(jq -r '.[0].results[0].package_sha256 // empty' <<<"$job_json")
            assert_eq "$status" "complete" "${package_id} import job status"
            assert_eq "$sha" "$package_sha" "${package_id} package SHA-256"

            local cases_json case_total case_active
            cases_json=$(run_query "
              SELECT
                COUNT(*) AS total,
                COALESCE(SUM(CASE WHEN is_active = 1 AND preview_session_id IS NULL THEN 1 ELSE 0 END), 0) AS active_production
              FROM cases
              WHERE id LIKE 'fc-import:${package_id}:case:%';
            ")
            printf '%s\n' "$cases_json"
            case_total=$(jq -r '.[0].results[0].total // empty' <<<"$cases_json")
            case_active=$(jq -r '.[0].results[0].active_production // empty' <<<"$cases_json")
            assert_eq "$case_total" "$expected" "${package_id} Case rows"
            assert_eq "$case_active" "$expected" "${package_id} active production Cases"

            local assets_json asset_total asset_active named_ecgs
            assets_json=$(run_query "
              SELECT
                COUNT(*) AS total,
                COALESCE(SUM(CASE WHEN is_active = 1 AND preview_session_id IS NULL AND type = 'image' THEN 1 ELSE 0 END), 0) AS active_images,
                COALESCE(SUM(CASE WHEN original_filename LIKE '% — ECG 01.%' THEN 1 ELSE 0 END), 0) AS named_ecgs
              FROM assets
              WHERE id LIKE 'fc-import:${package_id}:asset:%'
                AND storage_key LIKE 'teaching-images/import/${package_id}/%';
            ")
            printf '%s\n' "$assets_json"
            asset_total=$(jq -r '.[0].results[0].total // empty' <<<"$assets_json")
            asset_active=$(jq -r '.[0].results[0].active_images // empty' <<<"$assets_json")
            named_ecgs=$(jq -r '.[0].results[0].named_ecgs // empty' <<<"$assets_json")
            assert_eq "$asset_total" "$expected" "${package_id} Asset rows"
            assert_eq "$asset_active" "$expected" "${package_id} active production ECG Assets"
            assert_eq "$named_ecgs" "$expected" "${package_id} Case-aligned ECG filenames"

            local links_json link_total linked_cases linked_assets
            links_json=$(run_query "
              SELECT
                COUNT(*) AS links,
                COUNT(DISTINCT case_id) AS linked_cases,
                COUNT(DISTINCT asset_id) AS linked_assets
              FROM case_assets
              WHERE case_id LIKE 'fc-import:${package_id}:case:%'
                AND asset_id LIKE 'fc-import:${package_id}:asset:%';
            ")
            printf '%s\n' "$links_json"
            link_total=$(jq -r '.[0].results[0].links // empty' <<<"$links_json")
            linked_cases=$(jq -r '.[0].results[0].linked_cases // empty' <<<"$links_json")
            linked_assets=$(jq -r '.[0].results[0].linked_assets // empty' <<<"$links_json")
            assert_eq "$link_total" "$expected" "${package_id} Case↔ECG links"
            assert_eq "$linked_cases" "$expected" "${package_id} distinct Cases with imported ECG"
            assert_eq "$linked_assets" "$expected" "${package_id} distinct linked ECG Assets"

            echo "::endgroup::"
          }

          audit_batch \
            "ecg-anki-batch-01-20260816" \
            "9021997d31e547bdfa1a6f152fbe27143f85714b464c5f999f15a3e236f4c7e9" \
            "13"

          audit_batch \
            "ecg-anki-batch-02-20260816" \
            "926248292b002cbd33d40ad588eac9a6c0ec2833cbfe4290fe4b7bd0fdd72262" \
            "51"

          echo "::group::Pre-existing mapped calcium Cases"
          calcium_json=$(run_query "
            WITH mapped(case_id) AS (
              VALUES
                ('b11b6a14-c55e-4d70-849c-ce1c8953a38f'),
                ('b1f4870e-52fe-4d26-bbea-851ec64357a7')
            ),
            active_case_images AS (
              SELECT ca.case_id, a.id AS asset_id
              FROM case_assets ca
              JOIN assets a ON a.id = ca.asset_id
              WHERE a.type = 'image'
                AND a.is_active = 1
                AND a.preview_session_id IS NULL

              UNION

              SELECT sg.case_id, a.id AS asset_id
              FROM stimulus_groups sg
              JOIN stimulus_group_options sgo ON sgo.stimulus_group_id = sg.id
              JOIN assets a ON a.id = sgo.asset_id
              WHERE sg.is_active = 1
                AND sgo.is_active = 1
                AND a.type = 'image'
                AND a.is_active = 1
                AND a.preview_session_id IS NULL
            )
            SELECT
              m.case_id,
              ca.title,
              ca.is_active,
              ca.preview_session_id,
              COUNT(DISTINCT i.asset_id) AS active_image_count
            FROM mapped m
            LEFT JOIN cases ca ON ca.id = m.case_id
            LEFT JOIN active_case_images i ON i.case_id = m.case_id
            GROUP BY m.case_id, ca.title, ca.is_active, ca.preview_session_id
            ORDER BY m.case_id;
          ")
          printf '%s\n' "$calcium_json"

          calcium_rows=$(jq -r '.[0].results | length' <<<"$calcium_json")
          assert_eq "$calcium_rows" "2" "mapped calcium Case rows"

          invalid_calcium=$(jq -r '[.[0].results[] | select(.title == null or .is_active != 1 or .preview_session_id != null or (.active_image_count | tonumber) < 1)] | length' <<<"$calcium_json")
          assert_eq "$invalid_calcium" "0" "mapped calcium Cases active with at least one production image"
          echo "::endgroup::"

          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ECG production audit passed

          Exact source accounting verified against production D1:

          - Batch 01: 13 imported Cases + 13 imported ECG Assets + 13 Case↔ECG links.
          - Batch 02: 51 imported Cases + 51 imported ECG Assets + 51 Case↔ECG links.
          - Both import jobs are `complete` and match the recorded package SHA-256.
          - Both pre-existing mapped calcium Cases are active production Cases with at least one active production image.
          - Source accounting: 13 + 51 + 2 = 66 source notes represented.

          The workflow is read-only. It does not mutate D1, R2, Reviews, auth, or learner progress.
          EOF

      - name: Publish successful audit status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state success --arg context "${STATUS_CONTEXT}" --arg description 'Production D1 accounts for all 66 ECG source notes.' '{state:$state,context:$context,description:$description}')" >/dev/null

      - name: Publish failed audit status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state failure --arg context "${STATUS_CONTEXT}" --arg description 'ECG production D1 audit failed; inspect the workflow before updating migration docs.' '{state:$state,context:$context,description:$description}')" >/dev/null
