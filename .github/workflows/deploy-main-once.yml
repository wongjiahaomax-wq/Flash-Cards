name: Deploy current main once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-main-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_D1_WRITE_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_D1_WRITE_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check database migrations
        run: npm run db:check

      - name: Run tests
        run: npm test

      - name: Run Svelte checks
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: npx --yes wrangler@4.123.0 d1 migrations apply DB --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.123.0 deploy

# Deployment trigger: production rollout for merged PR #43 Tagging Stage B behavior and authoring.
