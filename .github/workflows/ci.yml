name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head for Checkpoint 6 finalization
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Finalize Checkpoint 6 evidence and remove temporary profilers
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          audit_path = Path('docs/TEST_SUITE_AUDIT.md')
          audit = audit_path.read_text()
          audit = replace_once(
              audit,
              'The actual Draft validation measurements below come from the unchanged repository-owned `validate-ci.mjs` path on those same four corrected attempts. Dependency installation is not included in any Node-stage, Svelte-stage or Draft-validation number.',
              'The actual Draft validation measurements below come from the unchanged repository-owned `validate-ci.mjs` path on those same four corrected attempts. Dependency installation is not included in any Node-stage, Svelte-stage or Draft-validation number. Because the temporary complete/fast measurement ran earlier in each of those same CI attempts, these Draft-validation samples are preconditioned rather than pristine cold-start latency measurements. They remain useful controlled stage-composition evidence on the fixed measurement head, but the 37.99135485 s median should not be presented as a clean production-Draft latency baseline. The complete-vs-fast 3.4117469272617313% conclusion comes from the separately alternated canonical complete/fast samples above.',
              'audit Draft preconditioning caveat',
          )
          audit = replace_once(
              audit,
              'A separate measurement-only profiler on head `aefaa303722528ca52707a700b82cb80a1416d50` / CI #1380 (`33343119928`) ran three complete `npm test` samples with a temporary reporter that consumed Node\'s per-file `test:summary` events. The profiler did not gate CI, change test selection, or replace ordinary repository validation. CI #1380 and Wrangler runtime-smoke #206 both passed.',
              'A separate measurement-only profiler on head `aefaa303722528ca52707a700b82cb80a1416d50` / CI #1380 (`33343119928`) ran three complete `npm test` samples with a temporary reporter that consumed Node\'s per-file `test:summary` events. The profiler did not gate CI, change test selection, or replace ordinary repository validation. CI #1380 and Wrangler runtime-smoke #206 both passed. The temporary profiler and reporter were removed from ordinary CI after evidence capture; they are not part of the durable validation path.',
              'audit profiler cleanup note',
          )
          audit = '\n'.join(line.rstrip(' \t') for line in audit.splitlines()) + '\n'
          audit_path.write_text(audit)

          plan_path = Path('docs/NODE_TEST_SUITE_CLEANUP_PLAN.md')
          plan = plan_path.read_text()
          status = 'Status: implementation plan active / Checkpoint 1 current-schema fixture normalization, Checkpoint 2A fast-test selection infrastructure, Checkpoint 2B change-aware specialized CI, Checkpoint 2C named production-operator validation ownership, Checkpoint 2D safe fast-test exclusions, Checkpoint 3 intentional UX regression review, Checkpoint 4 source-contract consolidation/review complete, all five bounded Checkpoint 5 behavioral rewrites complete, and Checkpoint 6 controlled runtime measurement/profiling complete in Draft PR #115'
          plan, count = re.subn(r'^Status:.*$', status, plan, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'plan status: expected one match, found {count}')
          plan = replace_once(
              plan,
              'Profiling/measurement, any additional exclusions, and the remaining durable-guidance work are still pending.',
              'Checkpoint 6 controlled measurement/profiling is complete. No additional exclusion was authorized; any remaining durable-guidance work remains separate later work.',
              'plan opening pending sentence',
          )
          plan = replace_once(
              plan,
              'Checkpoint 4 comprises five bounded consolidation tranches plus the separate explicit Stimulus Family façade retain review; Checkpoint 5 is complete.',
              'Checkpoint 4 comprises five bounded consolidation tranches plus the separate explicit Stimulus Family façade retain review; Checkpoint 5 is complete; Checkpoint 6 controlled runtime measurement/profiling is also complete, with no seventh exclusion authorized.',
              'plan implementation strategy summary',
          )
          profiling_replacement = (
              '### Profiling\n\n'
              'Checkpoint 6 is complete. Four corrected comparable complete/fast samples on fixed measurement head `9cb814a0d5c280a49f98b92b1b7203a86f8562a8` produced a complete `npm test` median of **19.8520 s** and a fast `npm run test:fast` median of **19.1747 s**, an absolute median difference of **0.6773 s** or **3.4117469272617313%**.\n\n'
              'The required **20% materiality gate was not met**. The result therefore does not justify a seventh exclusion and must not be described as a material fast-tier performance win. The measured head retained **110 maintained / 104 selected / 6 excluded** files and executed **664 complete / 629 fast** tests.\n\n'
              'On the same controlled attempts, `npm run check` had a **17.7247464 s** median. Repository-owned Draft validation had a **37.99135485 s** median, but those Draft samples ran after the temporary complete/fast measurement activity in each job and are therefore preconditioned stage-composition evidence rather than a pristine cold-start Draft-latency baseline.\n\n'
              'Because the materiality gate failed, three complete-suite file profiles were collected on profiling head `aefaa303722528ca52707a700b82cb80a1416d50`. The six already-specialized files together contributed only about **348.2 ms** median summed file time, while the highest-cost ordinary files were distributed across DB-heavy behavior/integration suites. The higher-value future performance candidates are benchmarked reduction of repeated current-schema/SQLite fixture setup and runner/file-fragmentation overhead while preserving isolation and complete coverage.\n\n'
              'The temporary Checkpoint 6 profiler/reporter are measurement scaffolding only and are removed before handoff. Checkpoint 7 remains pending and is outside this checkpoint.'
          )
          plan, count = re.subn(
              r'### Profiling\n\n.*?\n\n## 7\. Review gates',
              profiling_replacement + '\n\n## 7. Review gates',
              plan,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'plan profiling section: expected one match, found {count}')
          plan = replace_once(
              plan,
              '**Checkpoint 6:** runtime claim backed by comparable CI medians.',
              '**Checkpoint 6:** satisfied for controlled measurement/profiling. Four corrected comparable samples establish complete median 19.8520 s versus fast median 19.1747 s, a 3.4117469272617313% reduction below the 20% materiality gate. Profiling shows the six exclusions are cheap, no seventh exclusion is authorized, and future optimization should benchmark ordinary DB-fixture/setup and runner-fragmentation costs without weakening coverage. Final handoff still requires green repository-owned validation on the exact cleanup head.',
              'plan Checkpoint 6 review gate',
          )
          plan = '\n'.join(line.rstrip(' \t') for line in plan.splitlines()) + '\n'
          plan_path.write_text(plan)

          for path in (
              Path('scripts/checkpoint6-ci-profile.mjs'),
              Path('scripts/checkpoint6-file-profile-reporter.mjs'),
          ):
              if not path.exists():
                  raise SystemExit(f'missing expected temporary profiler: {path}')
              path.unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/TEST_SUITE_AUDIT.md docs/NODE_TEST_SUITE_CLEANUP_PLAN.md scripts/checkpoint6-ci-profile.mjs scripts/checkpoint6-file-profile-reporter.mjs
          if git diff --cached --quiet; then
            echo "Expected Checkpoint 6 cleanup changes were not produced."
            exit 1
          fi
          git commit -m "Finalize Checkpoint 6 evidence"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run repository validation
        env:
          VALIDATION_MODE: ${{ github.event.pull_request.draft && 'fast' || 'full' }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-ci.mjs --mode "$VALIDATION_MODE" --diff-base HEAD^1 --diff-head HEAD
