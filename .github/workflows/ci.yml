name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check diff whitespace
        run: git diff --check HEAD^1 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check database migrations
        run: npm run db:check

      - name: Run learning logic tests
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee /tmp/node-test-output.log; then
            exit 0
          fi
          diagnostic="$(grep -E '^(not ok|  error:|  code:|  failureType:|  location:|  stack:|    at )' /tmp/node-test-output.log || true)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Node test failure::${diagnostic}"
          exit 1

      - name: Run Svelte checks
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Smoke test local D1 and Better Auth
        run: node scripts/local-auth-smoke.mjs

  deploy-preview-pr34:
    if: github.event.pull_request.number == 34 && github.event.pull_request.head.ref == 'agent/image-management-v2' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact PR head and Preview safety
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA...$EXPECTED_SHA")"
          printf '%s\n' "$changed"
          schema_pattern='^(drizzle/|drizzle\.config\.js$|src/lib/server/db/schema\.js$|src/lib/server/db/[^/]*schema[^/]*\.js$)'
          if grep -Eq "$schema_pattern" <<<"$changed"; then
            echo "Refusing production-backed Preview deployment because this PR changes the D1 schema." >&2
            exit 1
          fi
          if grep -qx 'wrangler.jsonc' <<<"$changed"; then
            echo "Refusing production-backed Preview deployment because this PR changes wrangler.jsonc." >&2
            exit 1
          fi
          grep -q '"name": "flash-cards-preview"' wrangler.jsonc
          grep -q '"PREVIEW_MODE": "true"' wrangler.jsonc

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate exact head
        shell: bash
        run: |
          set -euo pipefail
          npm run db:check
          npm test
          npm run check
          npm run build
          node scripts/local-auth-smoke.mjs
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Deploy exact head to Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --env preview

      - name: Write Preview deployment summary
        shell: bash
        run: |
          {
            echo "## PR #34 Preview refresh"
            echo ""
            echo "- Exact PR head: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- Worker: \`flash-cards-preview\`"
            echo "- Preview URL: https://flash-cards-preview.mmed-fm-flashcardstest.workers.dev"
            echo "- D1 migrations: **not run**"
          } >> "$GITHUB_STEP_SUMMARY"
