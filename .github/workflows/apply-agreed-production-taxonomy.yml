name: Apply agreed production taxonomy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the fixed taxonomy update after reviewing the pre-flight output
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify dedicated D1 write credentials
        shell: bash
        env:
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_D1_WRITE_TOKEN:-}" ]; then
            echo "::error::Configure CLOUDFLARE_D1_WRITE_TOKEN with D1 write/edit permission for the production account."
            exit 1
          fi
          echo "A dedicated D1 write token is configured; its value will not be printed."

      - name: Run fixed taxonomy operator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: node scripts/apply-agreed-taxonomy.mjs ${{ inputs.apply && '--apply' || '--dry-run' }}

      - name: Record operator safety boundary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Agreed production taxonomy operator

          This workflow is manually triggered and invokes only the repository's fixed, purpose-specific taxonomy script.

          It does not accept SQL or record IDs as workflow inputs, does not run during deployment, and does not query or modify authentication, users, Reviews, questions, assets, or learner progress.

          The dedicated D1 write token is exposed only to the credential-check and operator steps, not to the whole job.

          The operator performs a human-readable pre-flight read plus machine safety checks. When `apply` is checked, Wrangler sends the fixed mutation statements as one D1 batch, followed by human-readable and machine-enforced post-flight verification.
          EOF
