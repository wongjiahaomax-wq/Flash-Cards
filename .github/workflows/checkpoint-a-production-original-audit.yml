name: Checkpoint A Production Original audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-a-production-original-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event.pull_request.number == 112 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify read-only audit credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_D1_READ_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Count qualifying one-option uncurated Production Families
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler d1 execute DB --remote --json --command "
            SELECT COUNT(*) AS qualifying_count
            FROM stimulus_groups sg
            JOIN cases c ON c.id = sg.case_id
            WHERE c.is_active = true
              AND c.preview_session_id IS NULL
              AND sg.is_active = true
              AND sg.original_option_id IS NULL
              AND 1 = (
                SELECT COUNT(*)
                FROM stimulus_group_options sgo
                JOIN assets a ON a.id = sgo.asset_id
                WHERE sgo.stimulus_group_id = sg.id
                  AND sgo.is_active = true
                  AND sgo.removed_from_case = false
                  AND a.is_active = true
                  AND a.type = 'image'
                  AND a.preview_session_id IS NULL
              );
          "

      - name: Record audit boundary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Checkpoint A Production Original audit

          Read-only D1 inspection only. The query counts active Production Stimulus Families with `original_option_id IS NULL` and exactly one eligible active/non-removed option backed by an active Production image Asset. Preview rows are excluded. No Production writes are performed.
          EOF
