name: Generate final status docs on branch once

on:
  push:
    branches:
      - agent/final-docs-direct
    paths:
      - .github/workflows/finalize-docs-branch-once.yml

permissions:
  contents: write
  statuses: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATUS_CONTEXT: final-docs-branch
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state pending --arg context "${STATUS_CONTEXT}" --arg description 'Generating verified final documentation branch.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-docs-direct
          fetch-depth: 0

      - name: Run verified documentation generator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/finalize-status-docs-observed-once.yml').read_text()
          match = re.search(r"python3 <<'PY'\n(.*?)\n          PY", source, flags=re.S)
          if not match:
              raise SystemExit('Could not extract verified documentation generator from observed finalizer workflow.')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, 'verified-doc-generator', 'exec'), {})
          Path('.github/workflows/finalize-docs-branch-once.yml').unlink(missing_ok=True)
          PY

          git diff --check
          echo 'Generated documentation diff:'
          git diff --stat

      - name: Commit final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_PRODUCT_ROADMAP.md \
                  docs/HANDOVER.md \
                  docs/IMPLEMENTATION_PLAN.md \
                  docs/ANKI_TO_FLASHCARDS_MIGRATION_WORKFLOW.md \
                  .github/workflows
          git commit -m "Finalize Stage B and ECG migration status"
          git push origin HEAD:agent/final-docs-direct

      - name: Publish successful status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state success --arg context "${STATUS_CONTEXT}" --arg description 'Verified final documentation commit pushed to branch.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null

      - name: Publish failed status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(jq -nc --arg state failure --arg context "${STATUS_CONTEXT}" --arg description 'Final documentation branch generation failed; inspect linked run.' --arg target_url "${RUN_URL}" '{state:$state,context:$context,description:$description,target_url:$target_url}')" >/dev/null
