name: Learner FSRS browser benchmark

on:
  pull_request:
    paths:
      - 'docs/LEARNER_FSRS_PR_B_EVIDENCE.md'
      - 'scripts/learner-fsrs-run-benchmark.mjs'
      - 'src/lib/server/db/study-run-planning.js'
      - 'src/lib/server/learning/study-run-envelope.js'
      - 'src/lib/server/learning/study-run-planner.js'
      - 'test/learner-fsrs-run-benchmark.test.js'
      - 'test/learner-fsrs-run-envelope.test.js'
      - 'test/learner-fsrs-run-planner.test.js'
      - 'tools/learner-fsrs-browser-benchmark/benchmark.spec.mjs'
      - 'tools/learner-fsrs-browser-benchmark/package.json'
      - '.github/workflows/learner-fsrs-browser-benchmark.yml'

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-benchmark:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user 1001
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install isolated pinned Playwright runner
        run: npm install --prefix tools/learner-fsrs-browser-benchmark --no-save --package-lock=false --prefer-offline --no-audit --no-fund @playwright/test@1.55.0

      - name: Run real-browser localStorage benchmark
        run: tools/learner-fsrs-browser-benchmark/node_modules/.bin/playwright test tools/learner-fsrs-browser-benchmark/benchmark.spec.mjs --reporter=line --workers=1
