name: Deploy Preview foundation once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-preview-foundation-once.yml

permissions:
  contents: read

jobs:
  deploy-preview-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare deploy credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check database migrations
        run: npm run db:check

      - name: Run tests
        run: npm test

      - name: Run Svelte checks
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Deploy Preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.123.0 deploy --env preview

      - name: Configure independent Preview auth secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          openssl rand -base64 48 | npx --yes wrangler@4.123.0 secret put BETTER_AUTH_SECRET --env preview

# One-shot operational workflow for the initial PR #30 Preview Worker deployment.
# It intentionally does not apply D1 migrations. The Preview auth secret is generated
# in the runner and piped directly to Wrangler; its value is never committed or printed.
