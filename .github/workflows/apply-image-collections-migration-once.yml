name: Apply Image Collections migration once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-image-collections-migration-once.yml

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 0ada6bfd273d96d92682a853c4dd6fd2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify D1 write credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_D1_WRITE_TOKEN is not configured."
            exit 1
          fi

      - name: Preflight exact pending migration
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          pending="$(npx --yes wrangler@4.123.0 d1 migrations list DB --remote 2>&1)"
          printf '%s\n' "$pending"
          names="$(printf '%s\n' "$pending" | grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' | sort -u || true)"
          if [ "$names" != "0007_image_collections.sql" ]; then
            echo "::error::Expected exactly one unapplied migration: 0007_image_collections.sql. Found: ${names:-<none>}"
            exit 1
          fi

      - name: Apply migration 0007
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 migrations apply DB --remote

      - name: Verify Image Collections schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT name FROM sqlite_schema WHERE type='table' AND name='image_collections';" > /tmp/table.json
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT name FROM pragma_table_info('assets') WHERE name='image_collection_id';" > /tmp/column.json
          npx --yes wrangler@4.123.0 d1 execute DB --remote --json --command "SELECT name FROM d1_migrations WHERE name='0007_image_collections.sql';" > /tmp/migration.json
          node <<'NODE'
          const fs = require('node:fs');
          function rows(path) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const list = Array.isArray(data) ? data : [data];
            return list.flatMap((entry) => entry?.results ?? entry?.result?.results ?? []);
          }
          const table = rows('/tmp/table.json');
          const column = rows('/tmp/column.json');
          const migration = rows('/tmp/migration.json');
          if (!table.some((row) => row.name === 'image_collections')) throw new Error('image_collections table verification failed');
          if (!column.some((row) => row.name === 'image_collection_id')) throw new Error('assets.image_collection_id verification failed');
          if (!migration.some((row) => row.name === '0007_image_collections.sql')) throw new Error('D1 migration record verification failed');
          console.log('Verified image_collections, assets.image_collection_id, and d1_migrations record.');
          NODE

      - name: Report migration result to PR 34
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            body="D1 migration 0007_image_collections.sql applied and verified successfully. The image_collections table, assets.image_collection_id column, and d1_migrations record are present. No Worker deploy was performed by this workflow."
          else
            body="D1 migration 0007_image_collections.sql workflow did not complete successfully. No claim is being made that the migration is applied; inspect the workflow before proceeding with PR #34."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/34/comments" -f body="$body"
