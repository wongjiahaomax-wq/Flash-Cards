name: Restore Main to Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-main:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current main SHA
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not return a valid immutable main SHA." >&2
            exit 1
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact main SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.main.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out main SHA
        env:
          EXPECTED_SHA: ${{ steps.main.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Restoring exact main commit: $actual_sha"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check database migrations
        run: npm run db:check

      - name: Run tests
        run: npm run test:verbose

      - name: Run Svelte checks
        run: npm run check:verbose

      - name: Build application
        run: npm run build:verbose

      - name: Smoke test local D1 and Better Auth
        run: node scripts/local-auth-smoke.mjs

      - name: Verify Preview Worker target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "flash-cards-preview"' wrangler.jsonc
          grep -q '"PREVIEW_MODE": "true"' wrangler.jsonc

      - name: Deploy main to Preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --env preview

      - name: Write deployment summary
        env:
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
        shell: bash
        run: |
          {
            echo "## Restore Main to Preview"
            echo ""
            echo "- Exact main SHA: \`${MAIN_SHA}\`"
            echo "- Worker: \`flash-cards-preview\`"
            echo "- Preview URL: https://flash-cards-preview.mmed-fm-flashcardstest.workers.dev"
            echo "- D1 migrations: **not run**"
          } >> "$GITHUB_STEP_SUMMARY"
