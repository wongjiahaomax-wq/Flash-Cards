name: Wrangler runtime smoke

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'svelte.config.js'
      - 'scripts/wrangler-runtime-smoke.mjs'
      - 'scripts/wrangler-runtime-smoke-lib.mjs'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start repository-pinned Wrangler runtime
        run: npm run runtime:smoke
