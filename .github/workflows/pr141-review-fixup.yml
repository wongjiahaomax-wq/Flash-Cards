name: PR 141 review fixup

on:
  push:
    branches:
      - agent/fsrs-pr-g-admin-analytics-deletion

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fsrs-pr-g-admin-analytics-deletion
          fetch-depth: 0
      - name: Apply review-blocker fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one regex match in {path}: {pattern!r}; found {count}")
              write(path, updated)

          # 1) Make auth-owned sessions a first-class bounded staged-deletion phase.
          path = 'src/lib/server/db/learner-account-deletion.ts'
          replace_once(path,
              "const PHASES = [\n  { phase: 'auth_verifications', table: 'verification', userColumn: 'value', next: 'free_receipts' },",
              "const PHASES = [\n  { phase: 'auth_sessions', table: 'session', userColumn: 'userId', next: 'auth_verifications' },\n  { phase: 'auth_verifications', table: 'verification', userColumn: 'value', next: 'free_receipts' },")
          replace_regex_once(path,
              r"async function revokeAccess\(client: D1Database, userId: string\) \{.*?\n\}",
              '''async function revokeAccess(client: D1Database, userId: string) {
            await client.prepare(`
              UPDATE user
              SET banned = 1,
                  banReason = 'Account deletion in progress',
                  banExpires = NULL,
                  updatedAt = ${DATABASE_NOW_MS_SQL}
              WHERE id = ? AND (role IS NULL OR role = 'user')
            `).bind(userId).run();
          }''')
          replace_once(path,
              "    `).bind(userId),\n    client.prepare('DELETE FROM session WHERE userId = ?').bind(userId)\n  ]);",
              "    `).bind(userId)\n  ]);")
          replace_once(path,
              "      VALUES (?, 'auth_verifications')",
              "      VALUES (?, 'auth_sessions')")
          replace_once(path,
              "  SELECT CASE\n    WHEN EXISTS (SELECT 1 FROM verification WHERE value = ? LIMIT 1) THEN 'auth_verifications'",
              "  SELECT CASE\n    WHEN EXISTS (SELECT 1 FROM session WHERE userId = ? LIMIT 1) THEN 'auth_sessions'\n    WHEN EXISTS (SELECT 1 FROM verification WHERE value = ? LIMIT 1) THEN 'auth_verifications'")
          replace_once(path, ".bind(...Array(12).fill(userId))", ".bind(...Array(13).fill(userId))")
          replace_once(path,
              " * final full learner-row rescan repairs any in-flight write that committed before\n * access revocation became authoritative. Better Auth 1.6.25 reset-password",
              " * final full learner-row rescan repairs any in-flight write that committed before\n * access revocation became authoritative. Existing Better Auth sessions are the\n * first bounded phase; the durable marker is the immediate access-denial authority.\n * Better Auth 1.6.25 reset-password")

          # 2) Keep the schema/migration phase contract aligned and make root deletion fail closed on sessions.
          path = 'src/lib/server/db/fsrs-analytics-schema.js'
          replace_once(path, "      enum: [\n        'auth_verifications',", "      enum: [\n        'auth_sessions',\n        'auth_verifications',")
          replace_once(path, ".default('auth_verifications')", ".default('auth_sessions')")

          path = 'drizzle/0025_learner_fsrs_admin_analytics_deletion.sql'
          replace_once(path, "`phase` text DEFAULT 'auth_verifications' NOT NULL,", "`phase` text DEFAULT 'auth_sessions' NOT NULL,")
          replace_once(path,
              "\tCONSTRAINT `learner_account_deletions_phase_check` CHECK (`phase` in (\n\t\t'auth_verifications',",
              "\tCONSTRAINT `learner_account_deletions_phase_check` CHECK (`phase` in (\n\t\t'auth_sessions',\n\t\t'auth_verifications',")
          replace_once(path,
              "\tAND (\n\t\tEXISTS (SELECT 1 FROM `verification` x WHERE x.`value` = OLD.`id`)",
              "\tAND (\n\t\tEXISTS (SELECT 1 FROM `session` x WHERE x.`userId` = OLD.`id`)\n\t\tOR EXISTS (SELECT 1 FROM `verification` x WHERE x.`value` = OLD.`id`)")

          # 3) Make the durable deletion marker authoritative for already-issued sessions while they drain.
          path = 'src/hooks.server.js'
          replace_once(path,
              "function forbidden(message) {\n  return new Response(message, {\n    status: 403,\n    headers: { 'content-type': 'text/plain; charset=utf-8' }\n  });\n}\n",
              "function forbidden(message) {\n  return new Response(message, {\n    status: 403,\n    headers: { 'content-type': 'text/plain; charset=utf-8' }\n  });\n}\n\nasync function learnerDeletionInProgress(db, userId) {\n  const row = await db.prepare(`\n    SELECT 1 AS active FROM learner_account_deletions WHERE user_id = ? LIMIT 1\n  `).bind(userId).first();\n  return Boolean(row);\n}\n")
          replace_once(path,
              "  event.locals.session = session?.session ?? null;\n  event.locals.user = session?.user ?? null;\n\n  // Preview-only identities",
              "  event.locals.session = session?.session ?? null;\n  event.locals.user = session?.user ?? null;\n\n  // A learner account-deletion marker is the immediate access-revocation authority.\n  // Existing Better Auth session rows are drained in bounded batches, so a session\n  // cookie that predates deletion must fail closed even before its row is removed.\n  if (\n    event.locals.user?.id &&\n    (event.locals.user.role == null || event.locals.user.role === 'user') &&\n    await learnerDeletionInProgress(env.DB, event.locals.user.id)\n  ) {\n    event.locals.session = null;\n    event.locals.user = null;\n    return forbidden('Learner account deletion is in progress.');\n  }\n\n  // Preview-only identities")

          # 4) Strengthen focused regression/source-contract coverage.
          path = 'test/learner-fsrs-pr-g.test.js'
          replace_once(path,
              "    INSERT INTO session (id, expiresAt, token, createdAt, updatedAt, userId)\n    VALUES ('session-a', 9999999999999, 'session-token-a', 1, 1, 'learner-a');",
              "    INSERT INTO session (id, expiresAt, token, createdAt, updatedAt, userId) VALUES\n      ('session-a', 9999999999999, 'session-token-a', 1, 1, 'learner-a'),\n      ('session-b', 9999999999999, 'session-token-b', 1, 1, 'learner-a'),\n      ('session-c', 9999999999999, 'session-token-c', 1, 1, 'learner-a'),\n      ('session-d', 9999999999999, 'session-token-d', 1, 1, 'learner-a'),\n      ('session-e', 9999999999999, 'session-token-e', 1, 1, 'learner-a');")
          replace_once(path,
              "    assert.equal(started.phase, 'auth_verifications');\n    assert.equal(sqlite.prepare(\"SELECT banned FROM user WHERE id = 'learner-a'\").get().banned, 1);\n    assert.equal(sqlite.prepare(\"SELECT COUNT(*) AS n FROM session WHERE userId = 'learner-a'\").get().n, 0);",
              "    assert.equal(started.phase, 'auth_sessions');\n    assert.equal(sqlite.prepare(\"SELECT banned FROM user WHERE id = 'learner-a'\").get().banned, 1);\n    assert.equal(\n      sqlite.prepare(\"SELECT COUNT(*) AS n FROM session WHERE userId = 'learner-a'\").get().n,\n      5,\n      'begin must revoke access through durable state without an unbounded session delete'\n    );")
          replace_once(path,
              "    assert.equal(ready, true, 'bounded retries should reach the identity-ready state');\n    assert.ok(deletionSteps.filter((step) => step.rowsDeleted === 2).length >= 2, 'fixture should require repeated bounded chunks');",
              "    assert.equal(ready, true, 'bounded retries should reach the identity-ready state');\n    assert.deepEqual(\n      deletionSteps.slice(0, 3).map((step) => [step.phase, step.rowsDeleted]),\n      [['auth_sessions', 2], ['auth_sessions', 2], ['auth_verifications', 1]],\n      'Better Auth sessions must drain as repeated bounded steps before verification/FSRS cleanup'\n    );\n    assert.equal(sqlite.prepare(\"SELECT COUNT(*) AS n FROM session WHERE userId = 'learner-a'\").get().n, 0);\n    assert.ok(deletionSteps.filter((step) => step.rowsDeleted === 2).length >= 2, 'fixture should require repeated bounded chunks');")

          path = 'test/learner-fsrs-pr-g-source-contract.test.js'
          replace_once(path,
              "  const migration = source('drizzle/0025_learner_fsrs_admin_analytics_deletion.sql');\n\n  assert.equal(packageJson.dependencies['better-auth'], '1.6.25');",
              "  const migration = source('drizzle/0025_learner_fsrs_admin_analytics_deletion.sql');\n  const hooks = source('src/hooks.server.js');\n\n  assert.equal(packageJson.dependencies['better-auth'], '1.6.25');")
          replace_once(path,
              "  assert.match(adminRoute, /auth\\.api\\.removeUser/);\n  assert.match(deletion, /phase:\\s*'auth_verifications'/);",
              "  assert.match(adminRoute, /auth\\.api\\.removeUser/);\n  assert.match(deletion, /phase:\\s*'auth_sessions'/);\n  assert.match(deletion, /table:\\s*'session',\\s*userColumn:\\s*'userId'/);\n  assert.doesNotMatch(deletion, /DELETE FROM session WHERE userId = \\?/);\n  assert.match(hooks, /learner_account_deletions/);\n  assert.match(deletion, /phase:\\s*'auth_verifications'/);")
          replace_once(path,
              "  assert.match(migration, /EXISTS \\(SELECT 1 FROM `verification` x WHERE x\\.`value` = OLD\\.`id`\\)/);\n});",
              "  assert.match(migration, /EXISTS \\(SELECT 1 FROM `session` x WHERE x\\.`userId` = OLD\\.`id`\\)/);\n  assert.match(migration, /EXISTS \\(SELECT 1 FROM `verification` x WHERE x\\.`value` = OLD\\.`id`\\)/);\n});\n\ntest('PR G authoritative data-model/index documents include migration 0025 and no longer describe PR G as pending', () => {\n  const model = source('docs/V1_DATA_MODEL.md');\n  const index = source('docs/DOCUMENTATION_INDEX.md');\n  assert.match(model, /0025_learner_fsrs_admin_analytics_deletion\\.sql/);\n  assert.match(model, /fsrs-analytics-schema\\.js/);\n  assert.match(model, /learner_system_monthly_buckets/);\n  assert.match(model, /auth_sessions/);\n  assert.match(index, /0025_learner_fsrs_admin_analytics_deletion\\.sql/);\n  assert.match(index, /LEARNER_FSRS_PR_G_EVIDENCE\\.md/);\n  assert.doesNotMatch(index, /PR G Admin\\/cohort analytics, account deletion, and automatic optimizer execution remain separately owned/);\n});")

          # 5) Benchmark auth-owned sessions across multiple bounded chunks.
          path = 'scripts/learner-fsrs-account-deletion-benchmark.mjs'
          replace_once(path,
              "  const { caseCount, eventCount, systemCount, freeReceiptCount } = options;",
              "  const { caseCount, eventCount, systemCount, freeReceiptCount, sessionCount } = options;")
          replace_once(path, "    for (let index = 0; index < 20; index += 1) {", "    for (let index = 0; index < sessionCount; index += 1) {")
          replace_once(path,
              "    freeReceiptCount: options.freeReceiptCount ?? 2_000\n  };",
              "    freeReceiptCount: options.freeReceiptCount ?? 2_000,\n    sessionCount: options.sessionCount ?? 5_000\n  };")
          replace_once(path,
              "    assert.equal(authVerificationCount, 1);\n\n    let directDeleteBlocked = false;",
              "    assert.equal(authVerificationCount, 1);\n    const authSessionCount = Number(db.prepare(`\n      SELECT COUNT(*) AS n FROM session WHERE userId = 'benchmark-user'\n    `).get().n);\n    assert.equal(authSessionCount, fixture.sessionCount);\n\n    let directDeleteBlocked = false;")
          replace_once(path,
              "    const begin = await measured(() => beginLearnerAccountDeletion({ db: learningDb, userId: 'benchmark-user' }));\n    const stepDurations = [];",
              "    const begin = await measured(() => beginLearnerAccountDeletion({ db: learningDb, userId: 'benchmark-user' }));\n    assert.equal(begin.value.phase, 'auth_sessions');\n    assert.equal(Number(db.prepare(\"SELECT COUNT(*) AS n FROM session WHERE userId = 'benchmark-user'\").get().n), fixture.sessionCount);\n    const stepDurations = [];")
          replace_once(path,
              "    assert.ok(Math.max(...stepRows) <= LEARNER_ACCOUNT_DELETION_BATCH_SIZE);\n    assert.equal(Number(db.prepare(\"SELECT COUNT(*) AS n FROM verification WHERE value = 'benchmark-user'\").get().n), 0);",
              "    assert.ok(Math.max(...stepRows) <= LEARNER_ACCOUNT_DELETION_BATCH_SIZE);\n    assert.equal(Number(db.prepare(\"SELECT COUNT(*) AS n FROM session WHERE userId = 'benchmark-user'\").get().n), 0);\n    assert.equal(Number(db.prepare(\"SELECT COUNT(*) AS n FROM verification WHERE value = 'benchmark-user'\").get().n), 0);")
          replace_once(path,
              "        'Scheduled history and current-generation optimizer evidence are not hard-capped, so no finite one-shot mature-account cascade can be proven bounded. The staged path caps each child delete at 1,000 rows.',",
              "        'Scheduled history, current-generation optimizer evidence, and Better Auth sessions have no finite per-learner lifetime row cap, so no one-shot mature-account cascade is certified. The staged path caps every learner-owned child/auth purge at 1,000 rows.',")
          replace_once(path, "        authSessions: 20", "        authSessions: authSessionCount")

          # 6) Real workerd/D1 proof uses 2,500 auth sessions (> two batches).
          path = 'scripts/learner-fsrs-account-deletion-d1-smoke.mjs'
          replace_once(path, "const deletionBatchSize = 1_000;", "const deletionBatchSize = 1_000;\nconst sessionCount = 2_500;")
          replace_once(path, "    Array.from({ length: 20 }, (_, index) =>", "    Array.from({ length: sessionCount }, (_, index) =>")
          replace_once(path,
              "    assert.equal(initial.verifications, 1, 'mature fixture must include learner-owned Better Auth verification state');\n    assert.equal(initial.scheduledEvents, eventCount);",
              "    assert.equal(initial.verifications, 1, 'mature fixture must include learner-owned Better Auth verification state');\n    assert.equal(initial.sessions, sessionCount, 'mature fixture must force multiple bounded auth-session batches');\n    assert.equal(initial.scheduledEvents, eventCount);")
          replace_once(path,
              "    const begun = await fetchJson(baseUrl, '/begin');\n    assert.equal(begun.status.banned, true);\n    assert.equal(begun.status.sessions, 0, 'access revocation must delete Better Auth sessions before child cleanup');",
              "    const begun = await fetchJson(baseUrl, '/begin');\n    assert.equal(begun.status.banned, true);\n    assert.equal(begun.status.phase, 'auth_sessions');\n    assert.equal(begun.status.sessions, sessionCount, 'access revocation must not use an unbounded Better Auth session delete');")
          replace_once(path,
              "    assert.equal(ready, true, `D1 staged deletion did not become identity-ready; phase=${latest.phase}`);\n    assert.equal(latest.verifications, 0);",
              "    assert.equal(ready, true, `D1 staged deletion did not become identity-ready; phase=${latest.phase}`);\n    assert.deepEqual(steps.slice(0, 3), [\n      { phase: 'auth_sessions', rowsDeleted: 1000 },\n      { phase: 'auth_sessions', rowsDeleted: 1000 },\n      { phase: 'auth_verifications', rowsDeleted: 500 }\n    ], 'D1 must drain 2,500 auth sessions through three bounded staged steps');\n    assert.equal(latest.sessions, 0);\n    assert.equal(latest.verifications, 0);")
          replace_once(path, "        authSessions: 20,", "        authSessions: sessionCount,")
          replace_once(path,
              "      accessRevokedBeforeCleanup: begun.status.banned && begun.status.sessions === 0,",
              "      accessRevokedBeforeCleanup: begun.status.banned && begun.status.phase === 'auth_sessions' && begun.status.sessions === sessionCount,")

          # 7) Keep the specialized path filter aware of the request-level access guard.
          path = '.github/workflows/learner-fsrs-pr-g-analytics-deletion.yml'
          replace_once(path, "      - 'src/lib/server/auth.js'\n", "      - 'src/lib/server/auth.js'\n      - 'src/hooks.server.js'\n")

          # 8) Correct PR G evidence/runtime wording for staged auth-session ownership.
          path = 'docs/LEARNER_FSRS_PR_G_EVIDENCE.md'
          replace_once(path,
              "2. bans the learner and deletes Better Auth sessions before large child cleanup;\n3. database guards reject new sessions and active Reviews while the marker exists;\n4. deletes at most 1,000 rows in one staged child-table step;",
              "2. bans the learner and commits that access-disabled state with the durable deletion marker;\n3. the request hook treats that marker as immediate access denial even while old session rows remain; database guards reject new sessions and active Reviews;\n4. drains existing Better Auth sessions as the first retry-safe phase, deleting at most 1,000 session rows per step;\n5. deletes at most 1,000 rows in every subsequent auth/application child-table step;")
          replace_once(path,
              "5. is retry-safe if a delete commits but the phase update does not;\n6. performs a full residual rescan before declaring the identity ready for deletion;\n7. keeps a database guard on learner `user` deletion so an in-flight writer that recreates learner-owned rows forces the final identity delete to fail closed and be retried;\n8. calls pinned Better Auth Admin `removeUser` only after the staged data gate is clear.",
              "6. is retry-safe if a delete commits but the phase update does not;\n7. performs a full residual rescan before declaring the identity ready for deletion;\n8. keeps a database guard on learner `user` deletion so any surviving session/auth/application row forces final identity deletion to fail closed and be retried;\n9. calls pinned Better Auth Admin `removeUser` only after the staged data gate is clear.")
          replace_once(path,
              "- Better Auth credential account, 20 sessions, and a learner-owned password-reset verification row.",
              "- Better Auth credential account, 5,000 sessions (five full 1,000-row purge batches), and a learner-owned password-reset verification row.")
          replace_once(path,
              "The local workerd/D1 smoke uses a smaller but multi-batch fixture, including the same Better Auth verification ownership class, and proves the same state machine through the actual D1 binding.",
              "The local workerd/D1 smoke uses a smaller but multi-batch fixture with 2,500 Better Auth sessions plus the same verification ownership class, and proves the same state machine through the actual D1 binding.")
          replace_once(path,
              "- session invalidation/new-session guard during deletion;",
              "- immediate marker-authoritative access denial, bounded multi-batch session purge, and the new-session guard during deletion;")

          path = 'docs/LEARNER_FSRS_RUNTIME_CUTOVER_STATUS.md'
          replace_once(path, "Date: 3 September 2026", "Date: 4 September 2026")
          replace_once(path,
              "3. bans the learner and removes Better Auth sessions before large child cleanup;\n4. rejects new sessions and new active Reviews while deletion is in progress;\n5. removes at most 1,000 rows from one learner-owned deletion class per staged step;",
              "3. bans the learner and commits the durable deletion marker as the immediate access-disabled authority;\n4. the request hook rejects any already-issued learner session while the marker exists, and database guards reject new sessions/new active Reviews;\n5. drains Better Auth sessions as the first staged ownership class, at most 1,000 rows per step;\n6. removes at most 1,000 rows from every subsequent auth/application deletion class per staged step;")
          replace_once(path,
              "6. removes Better Auth password-reset verification records owned by the learner through `verification.value` before FSRS/runtime cleanup;\n7. removes Free receipts, Scheduled events, active Reviews/children, optimizer evidence, learner×Case state, encounters, durable monthly buckets, System aggregates, learner aggregates, preferences and profile state;\n8. rescans every staged ownership class before declaring the identity ready;\n9. calls pinned Better Auth Admin `removeUser` only after the staged-data gate is clear.",
              "7. removes Better Auth password-reset verification records owned by the learner through `verification.value` before FSRS/runtime cleanup;\n8. removes Free receipts, Scheduled events, active Reviews/children, optimizer evidence, learner×Case state, encounters, durable monthly buckets, System aggregates, learner aggregates, preferences and profile state;\n9. rescans every staged ownership class before declaring the identity ready;\n10. calls pinned Better Auth Admin `removeUser` only after the staged-data gate is clear.")
          replace_once(path,
              "A database user-delete guard fails closed if any learner-owned row or learner-owned verification record remains or reappears before identity deletion,",
              "A database user-delete guard fails closed if any learner-owned session, verification, or application row remains or reappears before identity deletion,")

          # 9) Synchronize the authoritative V1 data-model baseline and migration ledger.
          path = 'docs/V1_DATA_MODEL.md'
          replace_once(path, "_Last updated: 3 September 2026_", "_Last updated: 4 September 2026_")
          replace_once(path,
              "This document records the implemented V1 application data model represented by current `main` after the learner FSRS runtime cutover, contextual System/Topic/Tag navigation, Primary-Topic-only Case behavior, Original/Alternative stimulus changes, and merged PR #139 (PR F) Reset/Fresh/retention ownership.",
              "This document records the implemented V1 application data model through the learner FSRS runtime cutover, merged PR #139 (PR F) Reset/Fresh/retention ownership, and PR G Admin analytics/account-deletion repository implementation (migration `0025`).")
          replace_once(path,
              "0024_learner_fsrs_reset_fresh.sql\n```",
              "0024_learner_fsrs_reset_fresh.sql\n0025_learner_fsrs_admin_analytics_deletion.sql\n```")
          replace_once(path,
              "- `0024` — defensive Scheduled active-Review/profile-boundary guard used by Reset Progress / Fresh FSRS Start serialization. It prevents generation/review-sequence/parameter/scheduler boundary movement while a Scheduled active Review still survives.\n",
              "- `0024` — defensive Scheduled active-Review/profile-boundary guard used by Reset Progress / Fresh FSRS Start serialization. It prevents generation/review-sequence/parameter/scheduler boundary movement while a Scheduled active Review still survives.\n- `0025` — durable learner × historical-System × UTC-month Scheduled analytics buckets, transactional bucket maintenance/backfill from still-retained detailed history, System-provenance guards, and the durable retry-safe learner account-deletion state/guards.\n")
          replace_once(path,
              "`src/lib/server/db/fsrs-schema.js` for durable FSRS/progress state, `src/lib/server/db/active-review-schema.js` for unfinished learner Review ownership, and `src/lib/server/db/free-study-schema.js` for Free completion receipts;",
              "`src/lib/server/db/fsrs-schema.js` for durable FSRS/progress state, `src/lib/server/db/fsrs-analytics-schema.js` for durable PR G monthly analytics/deletion state, `src/lib/server/db/active-review-schema.js` for unfinished learner Review ownership, and `src/lib/server/db/free-study-schema.js` for Free completion receipts;")
          replace_once(path,
              "19. Reset/Fresh scheduler-boundary changes consume any active Review and clear current learner×Case scheduler state atomically with the boundary change; browser run state is convenience only and old proofs still fail server-side current-profile checks.\n",
              "19. Reset/Fresh scheduler-boundary changes consume any active Review and clear current learner×Case scheduler state atomically with the boundary change; browser run state is convenience only and old proofs still fail server-side current-profile checks.\n20. Long-range Admin System/cohort time series are sourced from durable monthly buckets, never reconstructed from lifetime aggregates or optimizer evidence; mature account deletion uses durable marker-authoritative access denial and bounded retry-safe auth/application purges.\n")
          replace_once(path,
              "- a System with durable FSRS history in `scheduled_review_events` or `learner_system_aggregates` cannot be reclassified or deleted; application checks plus migration `0023` database triggers enforce this current provenance boundary.",
              "- a System with durable FSRS history in `scheduled_review_events`, `learner_system_aggregates`, or `learner_system_monthly_buckets` cannot be reclassified or deleted; centralized application checks plus migrations `0023`/`0025` database triggers enforce this provenance boundary.")
          text = read(path)
          marker = "## PR G — durable Admin analytics and mature learner account deletion"
          if marker not in text:
              text += '''\n\n## PR G — durable Admin analytics and mature learner account deletion\n\nMigration `0025_learner_fsrs_admin_analytics_deletion.sql` adds `learner_system_monthly_buckets`, keyed by `(user_id, system_id, month_start)`. `month_start` is the UTC calendar-month boundary; rows retain compact Scheduled completion and Again/Hard/Good/Easy counts plus first/last completion timestamps for the historical System recorded at study time. The migration backfills only still-retained `scheduled_review_events`, and an `AFTER INSERT` trigger maintains future buckets transactionally. Detailed-history expiry does not decrement or delete these buckets. Long-range Admin System/cohort trends use the monthly table directly and must not reconstruct expired time axes from `learner_system_aggregates` or `learner_optimizer_evidence`.\n\n`learner_account_deletions` is the durable mature-account deletion state. Its first phase is `auth_sessions`, followed by learner-owned reset-password verification rows and the learner FSRS/runtime ownership classes. Starting deletion atomically creates/resumes the marker and bans the learner; `src/hooks.server.js` treats the marker as immediate access denial even while pre-existing Better Auth session rows remain. Session insertion is blocked by a database trigger, existing sessions are purged in retry-safe chunks of at most 1,000 rows, and every subsequent staged class uses the same row bound. The final residual scan includes sessions, verification ownership, and all learner FSRS/runtime classes; the user-delete guard prevents an unbounded identity-root cascade while any staged row remains. Only after that gate is clear may Better Auth Admin `removeUser` remove the identity/account root.\n\nThe monthly analytics table and deletion-state table are learner-owned state, are account-deletable, and are explicitly forbidden from Production-to-local content replica import. `learner_system_monthly_buckets` is also part of centralized historical System provenance, so retained monthly attribution blocks destructive System reclassification/deletion even after detailed events expire.\n'''
              write(path, text)

          # 10) Synchronize the documentation index/status language so PR G is not described as future work.
          path = 'docs/DOCUMENTATION_INDEX.md'
          replace_once(path, "_Last reviewed: 3 September 2026_", "_Last reviewed: 4 September 2026_")
          replace_once(path,
              "Current `main` contains learner FSRS Parts A–E, PR #137 learner runtime cutover, and merged PR #139 (PR F).",
              "The repository baseline documented here contains learner FSRS Parts A–E, PR #137 learner runtime cutover, merged PR #139 (PR F), and the PR G Admin analytics/mature-account-deletion implementation through migration `0025`.")
          replace_once(path,
              "The merged repository migration chain therefore extends through `0024`.",
              "The repository migration chain documented by this PR therefore extends through `0025`.")
          replace_once(path,
              "0024_learner_fsrs_reset_fresh.sql\n```",
              "0025_learner_fsrs_admin_analytics_deletion.sql\n```")
          replace_once(path,
