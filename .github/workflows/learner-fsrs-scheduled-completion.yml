name: Learner FSRS Scheduled completion D1 smoke

on:
  pull_request:
    paths:
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'drizzle/0019_learner_fsrs_foundation.sql'
      - 'drizzle/0020_learner_fsrs_active_reviews.sql'
      - 'drizzle/0021_learner_fsrs_scheduled_completion.sql'
      - 'drizzle/0023_learner_fsrs_system_provenance_guard.sql'
      - 'drizzle.config.js'
      - 'scripts/learner-fsrs-scheduled-completion-d1-smoke.mjs'
      - 'scripts/learner-fsrs-scheduled-completion-d1-smoke-worker.js'
      - 'scripts/learner-fsrs-scheduled-due-repeat-d1-smoke.mjs'
      - 'scripts/learner-fsrs-scheduled-due-repeat-d1-smoke-worker.js'
      - 'src/lib/scheduled-study-run.js'
      - 'src/lib/server/db/index.js'
      - 'src/lib/server/db/fsrs-bootstrap.js'
      - 'src/lib/server/db/fsrs-schema.js'
      - 'src/lib/server/db/active-review-schema.js'
      - 'src/lib/server/db/active-reviews.js'
      - 'src/lib/server/db/scheduled-review-completion.js'
      - 'src/lib/server/learning/fsrs-scheduler.js'
      - 'src/lib/server/learning/study-run-planner.js'
      - 'src/lib/server/learning/study-run-proof.js'
      - 'test/learner-fsrs-scheduled-completion.test.js'
      - 'test/learner-fsrs-scheduled-run.test.js'
      - '.github/workflows/learner-fsrs-scheduled-completion.yml'

permissions:
  contents: read

jobs:
  scheduled-completion-d1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate migration history
        run: npm run db:check

      - name: Run focused Scheduled completion contracts
        run: node --test test/learner-fsrs-scheduled-completion.test.js test/learner-fsrs-scheduled-run.test.js

      - name: Run New completion and lifecycle races through local workerd and D1
        run: node scripts/learner-fsrs-scheduled-completion-d1-smoke.mjs

      - name: Run Due and Repeat completion through local workerd and D1
        run: node scripts/learner-fsrs-scheduled-due-repeat-d1-smoke.mjs
